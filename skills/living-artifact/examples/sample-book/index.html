/* Design language: type, whitespace and one neutral hairline. Rows, not cards. One cobalt accent for the thing
   to look at now. Status colours only in 7 px dots, always beside a word. Every colour is a light-dark() pair. */
:root {
  color-scheme: light dark;
  --bg: light-dark(#ffffff, #0d0d0f);
  --bg-subtle: light-dark(#fafafb, #111114);
  --bg-muted: light-dark(#f4f4f6, #18181c);
  --bg-hover: light-dark(#f3f3f5, #18181c);
  --surface: light-dark(#ffffff, #151518);
  --line: light-dark(#ececef, #222227);
  --line-strong: light-dark(#dcdce1, #313138);
  --text: light-dark(#0f0f12, #ededf0);
  --text-2: light-dark(#51515a, #a6a6b0);
  --text-3: light-dark(#6c6c76, #84848f);
  --text-4: light-dark(#a3a3ad, #5b5b65);
  --accent: light-dark(#3e4fd9, #5261ea);
  --accent-text: light-dark(#3342c2, #99a5ff);
  --accent-soft: light-dark(rgba(62,79,217,.08), rgba(125,140,255,.14));
  --accent-ring: light-dark(rgba(62,79,217,.24), rgba(125,140,255,.36));
  --series-2: var(--text-2);
  --series-3: var(--text-4);
  --ok: light-dark(#1f9d57, #3ecf8e);
  --warn: light-dark(#c98a0c, #e5a93b);
  --err: light-dark(#d43d3d, #f26d6d);
  --scrim: light-dark(rgba(15,15,18,.3), rgba(0,0,0,.62));
  --font-sans: "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Inter Display", "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 6px; --r: 8px; --r-lg: 12px;
  --ease: 150ms cubic-bezier(.2,0,0,1);
  --move: 600ms cubic-bezier(.4,0,.2,1);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
h1, h2, h3, h4, p, ol, ul, figure, dl, dd, pre { margin: 0; }
ol, ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
svg { display: block; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- shell: one header row, a side menu with every section, the page beside it ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top__in { padding: 0 16px 0 20px; height: 52px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex: 0 1 auto; overflow: hidden; }
.mark b { font-weight: 600; flex: none; }
.mark span { color: var(--text-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.topstate { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); white-space: nowrap; flex: none; }
.menubtn { display: none; margin-left: -6px; }
.links { position: relative; flex: none; }
.links__menu { position: absolute; right: 0; top: 38px; min-width: 240px; max-width: min(360px, 92vw); padding: 6px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 30; }
.links__menu a { display: grid; gap: 1px; padding: 8px 10px; border-radius: var(--r-sm); font-size: 13px; }
.links__menu a:hover { background: var(--bg-hover); }
.links__menu a span { color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
.startstrip { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: baseline; margin-bottom: 28px; padding: 14px 16px; border-radius: var(--r); background: var(--bg-muted); }
.startstrip b { font-weight: 600; white-space: nowrap; }
.startstrip p { color: var(--text-2); font-size: 14px; line-height: 21px; max-width: 72ch; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 40; padding: 8px 12px; border-radius: var(--r-sm); background: var(--text); color: var(--bg); font-size: 13px; }
.skip:focus { top: 8px; }
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); max-width: 1480px; margin: 0 auto; }
.side { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; overscroll-behavior: contain; padding: 18px 12px 40px 16px; border-right: 1px solid var(--line); background: var(--bg); }
.side__find { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); font-size: 13px; }
.side__find::placeholder { color: var(--text-3); }
.side__grp { margin-top: 18px; }
.side__gh { font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 4px; }
.sl { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 8px; border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-2); line-height: 18px; }
.sl:hover { background: var(--bg-hover); color: var(--text); }
.sl[aria-current="true"] { background: var(--bg-muted); color: var(--text); font-weight: 500; }
.sl .dot { margin-left: auto; }
.sl__kids { margin: 2px 0 6px 12px; padding-left: 8px; border-left: 1px solid var(--line); }
.sl__kids a { display: block; padding: 3px 8px; font-size: 12.5px; color: var(--text-3); border-radius: var(--r-sm); line-height: 17px; }
.sl__kids a:hover { color: var(--text); background: var(--bg-hover); }
.side__res a, .side__res button { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: var(--r-sm); font-size: 13px; color: var(--text-2); }
.side__res a:hover, .side__res button:hover { background: var(--bg-hover); color: var(--text); }
.side__res small { display: block; font-size: 11.5px; color: var(--text-3); }
.side__foot { margin-top: 24px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); display: grid; gap: 4px; }
.side__tools { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.side__tools .btn { height: 28px; padding: 0 9px; font-size: 12.5px; }
.scrim { position: fixed; inset: 52px 0 0 0; background: var(--scrim); z-index: 24; }
.pagebar { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 14px 0 0; font-size: 12.5px; color: var(--text-3); }
.spacer { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r); background: var(--bg-muted); flex-wrap: wrap; }
.top__in > .seg, .top__in > .btn, .top__in > .iconbtn { flex: none; flex-wrap: nowrap; }
.top__in > .btn { white-space: nowrap; }
.seg button { min-height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: color var(--ease), background-color var(--ease); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); color: var(--text-2); flex: none; }
.iconbtn:hover { background: var(--bg-hover); color: var(--text); }
.iconbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r); font-size: 13px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--bg); transition: background-color var(--ease); white-space: nowrap; }
.btn:hover { background: var(--bg-hover); }
.btn--pri { background: var(--text); color: var(--bg); border-color: transparent; }
.btn--pri:hover { background: var(--text); opacity: .88; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.linkbtn { color: var(--accent-text); font-size: 13px; min-height: 28px; display: inline-flex; align-items: center; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

.wrap { max-width: 1120px; padding: 0 40px; min-width: 0; width: 100%; }
.sec { padding: 88px 0 0; }
main > .sec:last-child { padding-bottom: 120px; }
.eyebrow { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h2 { font: 600 28px/1.2 var(--font-display); letter-spacing: -.025em; max-width: 22em; text-wrap: balance; }
.lead { margin-top: 12px; font-size: 16px; line-height: 26px; color: var(--text-2); max-width: 38em; text-wrap: pretty; }
.stage { margin-top: 40px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); flex: none; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); } .dot.acc { background: var(--accent); }
.dot.live { box-shadow: 0 0 0 0 var(--accent-ring); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-ring); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.cert { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.cert i { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; border: 1.25px solid var(--text-3); }
.cert.m i { background: var(--text-3); }
.st { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.agent-only { display: none !important; }
:root[data-mode="agent"] .agent-only { display: revert !important; }
:root[data-mode="agent"] span.agent-only, :root[data-mode="agent"] a.agent-only { display: inline !important; }
:root[data-mode="agent"] .human-only { display: none !important; }
.id { font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; color: var(--text-3); letter-spacing: -.01em; margin-left: 8px; }
.ev { font-size: 12px; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; }
.ev a { color: var(--text-3); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.ev a:hover { color: var(--text); }
.secfoot { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.fine { font-size: 12px; line-height: 18px; color: var(--text-3); max-width: 60em; }

/* ---------- numbers behind a figure ---------- */
.more > summary { list-style: none; cursor: pointer; color: var(--accent-text); font-size: 13px; display: inline-flex; min-height: 28px; align-items: center; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
.more[open] > summary { color: var(--text-2); }
.more .tblwrap { margin-top: 12px; }
.tblwrap { overflow-x: auto; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--text-3); padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.tbl td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--text-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.mono { white-space: nowrap; }
.tbl td:first-child { color: var(--text); }

/* ---------- story and status line ---------- */
.hero { padding-top: 72px; }
.hero h1 { font: 600 52px/1.05 var(--font-display); letter-spacing: -.035em; max-width: 15em; text-wrap: balance; }
.hero .lead { font-size: 18px; line-height: 28px; max-width: 34em; margin-top: 20px; }
.hero .stage { margin-top: 0; }
.hero--fig { position: relative; }
.story__fig { display: none; }
@media (min-width: 1400px) {
  .hero--fig { display: grid; grid-template-columns: minmax(0, 1fr) 300px; column-gap: 56px; align-content: start; }
  .hero--fig > * { grid-column: 1; }
  .hero--fig > .now, .hero--fig > .result, .hero--fig > .secfoot, .hero--fig > .declink { grid-column: 1 / -1; }
  .story__fig { display: block; grid-column: 2 !important; grid-row: 1 / span 4; align-self: start; }
  .story__fig .flow { display: block; }
  .story__fig .flow__bar, .story__fig .steps, .story__fig .cap, .story__fig .seg, .story__fig .sr, .story__fig .decided { display: none; }
  .story__fig .flow__map { padding: 12px; margin: 0; }
  .story__fig .linkbtn { display: inline-block; margin-top: 10px; font-size: 13px; }
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 48px; max-width: 880px; }
.stat b { display: block; font: 500 32px/1.15 var(--font-display); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.stat > span { display: block; margin-top: 6px; color: var(--text-2); font-size: 14px; }
.stat .cert, .stat .ev { display: flex; margin-top: 6px; }
.now { margin-top: 48px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.now__txt { display: flex; align-items: center; gap: 10px; font-weight: 500; flex-wrap: wrap; }
.now__txt small { font-size: 14px; font-weight: 400; color: var(--text-2); }
.now__bar { display: flex; gap: 4px; flex: 1; min-width: 160px; max-width: 420px; }
.now__bar a { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-muted); position: relative; overflow: hidden; }
.now__bar a i { position: absolute; inset: 0; width: 0; background: var(--text); border-radius: 3px; transition: width var(--move); }
.now__bar a.cur i { background: var(--accent); }
.now__fresh { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
.result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; margin-top: 40px; max-width: 880px; }
.result h3 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 8px; }
.ticks-list li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; color: var(--text-2); }
.ticks-list li .dot { transform: translateY(-1px); }
.ticks-list li.ok { color: var(--text); }

/* ---------- the one blocking choice ---------- */
.choice { margin-top: 0; padding: 24px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); max-width: 760px; }
.choice .eyebrow { color: var(--text-2); }
.choice h2 { font-size: 22px; }
.choice p { margin-top: 10px; color: var(--text-2); max-width: 40em; }
.choice ol { margin-top: 16px; }
.choice li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.choice li b { font-weight: 500; }
.choice li span { color: var(--text-2); display: block; }
.choice .num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text-3); }
.choice .def { margin-top: 14px; font-size: 13px; color: var(--text-2); }

/* ---------- system map and flow player ---------- */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 40px; align-items: start; }
.flow.solo { grid-template-columns: minmax(0, 1fr); }
.flow__bar { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.flow__map { position: relative; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg-subtle); padding: 28px 24px 24px; }
.flow__map svg { width: 100%; height: auto; overflow: visible; }
.cap { display: grid; grid-template-columns: 28px 1fr; gap: 2px 14px; align-items: start; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.cap .num { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cap b { font: 600 18px/28px var(--font-display); letter-spacing: -.015em; }
.cap p { grid-column: 2; color: var(--text-2); font-size: 14px; line-height: 21px; text-wrap: pretty; min-height: 21px; }
.cap small { grid-column: 2; margin-top: 6px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.cap small:empty::before { content: "\00a0"; }
.cap.inspect .num { background: var(--accent); }
.n-box { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1; transition: stroke var(--ease), fill var(--ease), stroke-width var(--ease); }
.n-zone { fill: none; stroke: var(--line-strong); stroke-dasharray: 3 4; }
.n-t { font: 600 13.5px var(--font-sans); fill: var(--text); letter-spacing: -.005em; }
.n-s { font: 400 12px var(--font-sans); fill: var(--text-3); }
.n-z { font: 500 11.5px var(--font-sans); fill: var(--text-3); }
.node { transition: opacity 300ms ease-out; cursor: default; }
.node:focus-visible { outline: none; }
.node:focus-visible .n-box { stroke: var(--accent-text); stroke-width: 2; }
.node.on .n-box, .node.hl .n-box { stroke: var(--accent); stroke-width: 1.5; fill: var(--surface); }
.node.on .n-halo { opacity: 1; }
.n-halo { fill: none; stroke: var(--accent-ring); stroke-width: 6; opacity: 0; transition: opacity 300ms ease-out; }
.node.dead .n-box { stroke: var(--err); stroke-dasharray: 4 3; }
.node.dead .n-t, .node.dead .n-s { fill: var(--text-3); }
.node.idle { opacity: .45; }
.node.dim { opacity: .35; }
.n-dot { fill: var(--text-4); transition: fill var(--ease); }
.node.on .n-dot, .node.busy .n-dot { fill: var(--ok); }
.node.dead .n-dot { fill: var(--err); }
.e-ln { fill: none; stroke: var(--line-strong); stroke-width: 1.25; transition: stroke 300ms ease-out; }
.e-ln.done { stroke: var(--text-3); }
.e-ln.on, .e-ln.hl { stroke: var(--accent); stroke-width: 1.5; }
.e-hd { fill: var(--line-strong); transition: fill 300ms ease-out; }
.e-hd.done { fill: var(--text-3); } .e-hd.on, .e-hd.hl { fill: var(--accent); }
.e-vb { font: 500 11.5px var(--font-sans); fill: var(--accent-text); paint-order: stroke; stroke: var(--bg-subtle); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity var(--ease); pointer-events: none; }
.e-vb.hl { opacity: 1; }
.tok { fill: var(--accent); }
.tok-h { fill: var(--accent-ring); }
.steps li + li { margin-top: 2px; }
.steps button { width: 100%; display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 10px; border-radius: var(--r); color: var(--text-2); transition: background-color var(--ease), color var(--ease); min-height: 38px; }
.steps button:hover { background: var(--bg-hover); color: var(--text); }
.steps .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text-3); font-variant-numeric: tabular-nums; }
.steps b { font-weight: 500; font-size: 14px; display: block; line-height: 22px; }
.steps button[aria-current="step"] { background: var(--bg-muted); color: var(--text); }
.steps button[aria-current="step"] .num { background: var(--text); color: var(--bg); box-shadow: none; }
.steps button.past .num { color: var(--text); }

/* ---------- step-through chain ---------- */
.chain { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; position: relative; }
.chain li { position: relative; padding-right: 20px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; width: 20px; top: 27px; height: 1px; background: var(--line-strong); }
.chain button { width: 100%; min-height: 56px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; padding: 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); transition: border-color var(--ease), background-color var(--ease); }
.chain button:hover { background: var(--bg-hover); }
.chain .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text-3); font-variant-numeric: tabular-nums; }
.chain b { font-weight: 500; font-size: 14px; line-height: 19px; }
.chain button.past { border-color: var(--text-3); }
.chain button.past .num { color: var(--text); }
.chain button[aria-current="step"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.chain button[aria-current="step"] .num { background: var(--text); color: var(--bg); box-shadow: none; }
.chain + .cap { border-top: 0; padding-top: 4px; margin-top: 24px; }

/* ---------- before and after ---------- */
.cmp__bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.cmp__fig { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 24px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg-subtle); }
.part { padding: 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); transition: opacity 300ms ease-out, border-color 300ms ease-out; min-height: 76px; }
.part b { display: block; font-weight: 600; font-size: 13.5px; }
.part span { display: block; margin-top: 4px; color: var(--text-2); font-size: 13px; line-height: 18px; transition: opacity 150ms ease-out; }
.part.changed { border-color: var(--accent); }
.part.gone { opacity: .3; border-style: dashed; }
.part.fade span { opacity: 0; }
.cmp__body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; margin-top: 24px; align-items: start; }
.cmp__pts { transition: opacity 150ms ease-out; }
.cmp__pts li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; color: var(--text); max-width: 40em; transition: opacity 150ms ease-out; }
.cmp__pts li .dot { transform: translateY(-1px); }
.cmp__nums { display: flex; gap: 32px; }
.cmp__nums .stat b { font-size: 26px; }
.fade-out { opacity: 0; }

/* ---------- scale ---------- */
.scale { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 64px; align-items: start; }
.dial + .dial { margin-top: 20px; }
.dial__label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.dial__label span { font-size: 13px; color: var(--text-2); }
.dial__val { font: 500 32px/1.15 var(--font-display); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.dial__val small { font: 400 14px var(--font-sans); color: var(--text-2); letter-spacing: 0; margin-left: 6px; }
.dial .seg { margin-top: 8px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 8px 0 0; cursor: pointer; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--text) var(--p), var(--line-strong) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--text); margin-top: -7px; box-shadow: 0 1px 2px rgba(0,0,0,.12); transition: transform var(--ease); }
input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--text); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.ticks { display: flex; justify-content: space-between; margin-top: 2px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ticks button { color: inherit; padding: 4px 0; min-height: 28px; }
.ticks button:hover { color: var(--text); }
.say { margin-top: 28px; font-size: 16px; line-height: 26px; color: var(--text); text-wrap: pretty; min-height: 78px; }
.flag { margin-top: 12px; display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--text-2); line-height: 20px; }
.flag .dot { transform: translateY(-1px); }
.unit { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); align-items: start; }
.unit:last-child { border-bottom: 1px solid var(--line); }
.unit__name { font-weight: 500; line-height: 20px; }
.unit__name small { display: block; font-weight: 400; font-size: 12px; color: var(--text-3); line-height: 16px; margin-top: 2px; }
.unit__num { font: 500 20px/20px var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.unit__num small { display: block; font: 400 12px/16px var(--font-sans); color: var(--text-3); letter-spacing: 0; margin-top: 2px; white-space: nowrap; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; min-height: 20px; align-content: flex-start; padding-top: 4px; }
.cell { width: 12px; height: 12px; border-radius: 2.5px; background: var(--text); animation: pop 200ms cubic-bezier(.2,0,0,1) backwards; }
.cell.ghost { background: none; box-shadow: inset 0 0 0 1px var(--line-strong); animation: none; }
.cell.out { animation: unpop 140ms ease-in forwards; }
.cells.more::after { content: attr(data-more); font-size: 12px; color: var(--text-3); align-self: center; margin-left: 6px; }
@keyframes pop { from { transform: scale(0); opacity: 0; } }
@keyframes unpop { to { transform: scale(0); opacity: 0; } }
.qbar { height: 11px; margin-top: 4px; border-radius: 3px; background: var(--bg-muted); overflow: hidden; }
.qbar i { display: block; height: 100%; width: 0; background: var(--series-2); border-radius: 3px; transition: width var(--move); }
.sizes { display: flex; gap: 3px; padding-top: 4px; align-items: flex-end; height: 34px; }
.sizes i { width: 34px; border-radius: 3px; background: var(--bg-muted); transition: background-color 300ms ease-out, height var(--move); height: 11px; }
.sizes i.on { background: var(--text); }

/* ---------- cost explorer ---------- */
.cost { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 64px; align-items: start; }
.chart svg { width: 100%; overflow: visible; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-ax { font: 400 11.5px var(--font-sans); fill: var(--text-3); font-variant-numeric: tabular-nums; }
.c-l { fill: none; stroke: var(--series-2); stroke-width: 1.5; stroke-linejoin: round; }
.c-l.s3 { stroke: var(--series-3); stroke-dasharray: 4 3; }
.c-l.ours { stroke: var(--accent); stroke-width: 2; }
.c-gap { fill: var(--accent-soft); }
.c-mark { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 3; }
.c-lbl { font: 500 12px var(--font-sans); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.c-p { fill: var(--bg); stroke: var(--series-2); stroke-width: 1.5; }
.c-p.ours { stroke: var(--accent); stroke-width: 2; }
.read__row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.read__row:first-child { border-top: 0; padding-top: 0; }
.read__row span { color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.read__row span i { width: 12px; height: 2px; border-radius: 1px; background: var(--series-2); flex: none; }
.read__row span i.ours { background: var(--accent); height: 3px; }
.read__row span i.s3 { background: var(--series-3); }
.read__row b { font: 500 20px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.read__row.big b { font-size: 32px; }
.sub { font-size: 12px; font-weight: 500; color: var(--text-3); margin: 28px 0 10px; }
.split { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; }
.split i { background: var(--accent); transition: flex-grow var(--move); min-width: 2px; border-radius: 2px; }
.split i:nth-child(2) { background: var(--series-2); } .split i:nth-child(3) { background: var(--series-3); }
.legend { margin-top: 10px; display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.legend div:nth-child(2) i { background: var(--series-2); } .legend div:nth-child(3) i { background: var(--series-3); }
.legend b { margin-left: auto; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.cost__ctl { margin-bottom: 28px; }

/* ---------- capability list ---------- */
.caps__bar { margin-bottom: 16px; }
.cap-row { border-top: 1px solid var(--line); }
.cap-row:last-child { border-bottom: 1px solid var(--line); }
.cap-row > .cap-head { width: 100%; display: grid; grid-template-columns: minmax(0, 18em) minmax(0, 1fr) 128px; gap: 6px 24px; align-items: baseline; padding: 13px 4px; min-height: 46px; }
.cap-row > button.cap-head:hover { background: var(--bg-hover); }
.cap-head b { font-weight: 500; }
.cap-head > span { color: var(--text-2); }
.cap-head .st { justify-self: end; }
.cap-more { padding: 0 4px 18px; display: grid; gap: 10px; max-width: 760px; }
.cap-head b { padding-left: 18px; position: relative; }
.cap-head .chev { position: absolute; left: 0; top: 4px; width: 12px; height: 12px; fill: none; stroke: var(--text-3); stroke-width: 1.5; transition: transform 200ms cubic-bezier(.2,0,0,1); }
.cap-head[aria-expanded="true"] .chev { transform: rotate(90deg); }

/* ---------- risk matrix ---------- */
.risk { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 56px; align-items: start; }
.rm { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, 76px) 22px; gap: 4px; }
.rm__cell { border-radius: var(--r-sm); background: var(--bg-subtle); border: 1px solid var(--line); display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px; padding: 4px; }
.rm__ax { font-size: 11.5px; color: var(--text-3); display: grid; place-items: center; }
.rm__ax.y { writing-mode: vertical-rl; transform: rotate(180deg); }
.rm__dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong); font-variant-numeric: tabular-nums; transition: background-color var(--ease), color var(--ease); }
.rm__dot.hl, .rm__dot:hover { background: var(--text); color: var(--bg); box-shadow: none; }
.rm__axis { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; align-items: center; font-size: 11.5px; color: var(--text-3); }
.rm__cap { margin-top: 8px; font-size: 12px; color: var(--text-3); }
.rl li { border-top: 1px solid var(--line); border-radius: var(--r-sm); transition: background-color var(--ease); }
.rl__head { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; min-height: 44px; padding: 10px 6px; text-align: left; border-radius: var(--r-sm); }
.rl__more { padding: 0 6px 12px 46px; }
.rl__more p + p { margin-top: 4px; }
.rl li:last-child { border-bottom: 1px solid var(--line); }
.rl li.hl { background: var(--bg-hover); }
.rl .rn { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text-2); }
.rl li.hl .rn { background: var(--text); color: var(--bg); box-shadow: none; }
.rl b { font-weight: 500; }
.rl p { color: var(--text-2); font-size: 13.5px; }

/* ---------- build: wave timeline and work cards ---------- */
.waves { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: relative; }
.waves::before { content: ""; position: absolute; left: 20px; right: 20px; top: 20px; height: 1px; background: var(--line-strong); }
.wave { position: relative; padding: 0 16px 16px 0; border-radius: var(--r); display: flex; flex-direction: column; justify-content: flex-start; width: 100%; }
.wave .ring { display: block; background: var(--bg); position: relative; width: 40px; height: 40px; border-radius: 50%; }
.ring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--line-strong); stroke-width: 2.5; }
.ring .arc { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset var(--move); }
.wave.cur .ring .arc { stroke: var(--accent); }
.wave.stopped .ring .arc { stroke: var(--err); }
.ring em { position: absolute; inset: 0; display: grid; place-items: center; font: 500 11.5px var(--font-sans); font-style: normal; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ring em svg { width: 14px; height: 14px; transform: none; fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wave > b { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
.wave .what { display: block; font-size: 13px; color: var(--text-2); line-height: 19px; margin-top: 2px; max-width: 17em; }
.wave .st { display: flex; margin-top: 10px; font-size: 12px; color: var(--text-3); }
.wave[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 16px; bottom: 0; height: 2px; background: var(--text); border-radius: 1px; }
.wave:hover > b { color: var(--accent-text); }
.wdetail { margin-top: 32px; }
.tk { border-top: 1px solid var(--line); }
.tk:last-child { border-bottom: 1px solid var(--line); }
.tk__dw { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.proofrow { margin: 4px 0 8px; font-size: 13px; }
.proofall { margin-top: 10px; max-width: 760px; }
.chk__t { font-weight: 500; color: var(--text); }
.chk__st { color: var(--text-3); font-size: 12px; }
.chk__pass { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
.tk__row { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 4px; min-height: 46px; transition: background-color var(--ease); }
.tk__row:hover { background: var(--bg-hover); }
.chev { width: 16px; height: 16px; fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms cubic-bezier(.2,0,0,1); }
.tk__row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.tk__title { font-weight: 500; }
.tk.stopped .tk__title { text-decoration: line-through; text-decoration-color: var(--text-4); }
.tk__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(.2,0,0,1); }
.tk__body > div { overflow: hidden; }
.tk.open .tk__body { grid-template-rows: 1fr; }
.tk__body > div { visibility: hidden; transition: visibility 0s 240ms; }
.tk.open .tk__body > div { visibility: visible; transition: none; }
.tk__in { padding: 4px 4px 24px 32px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; }
.tk__in h4 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.tk__in p { color: var(--text-2); max-width: 34em; }
.tk__in p + h4, .tk__in ul + h4 { margin-top: 18px; }
.chk li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; color: var(--text-2); }
.chk li .dot { transform: translateY(-1px); }
.chk li.ok { color: var(--text); }
.proof { margin-top: 18px; padding: 12px 14px; border-radius: var(--r); background: var(--bg-subtle); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; line-height: 19px; color: var(--text-2); overflow-x: auto; white-space: pre; }
.proof b { color: var(--text); font-weight: 500; }
.proof-img { margin-top: 12px; display: inline-block; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; max-width: 280px; }
.proof-img:hover { border-color: var(--line-strong); }
.proof-when { margin-top: 8px; font-size: 12px; color: var(--text-3); }
.raw { margin-top: 14px; display: none; gap: 4px 16px; grid-template-columns: auto minmax(0, 1fr); font-size: 12px; color: var(--text-3); }
:root[data-mode="agent"] .raw { display: grid; }
.raw dd { font-family: var(--font-mono); color: var(--text-2); overflow-wrap: anywhere; }
.buildbar { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- decided ---------- */
.decided { margin-top: 32px; max-width: 760px; }
.decided h3 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
.dec { padding: 12px 0; border-top: 1px solid var(--line); transition: background-color 600ms ease-out; }
.dec.flash { background: var(--accent-soft, var(--bg-hover)); }
.declink { margin-top: 24px; font-size: 13px; }
.declink .decided { margin-top: 8px; }
.dec:last-of-type { border-bottom: 1px solid var(--line); }
.dec b { font-weight: 500; display: block; }
.dec p { color: var(--text-2); margin-top: 2px; }
.dec small { display: block; margin-top: 4px; font-size: 12px; color: var(--text-3); }

/* ---------- roadmap rail ---------- */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: relative; }
.rail::before { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 1px; background: var(--line-strong); }
.rail li { position: relative; padding: 0 24px 0 0; }
.rail li > i { display: block; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--text-3); position: relative; }
.rail li:first-child > i { box-shadow: inset 0 0 0 1.5px var(--text); }
.rail b { display: block; margin-top: 14px; font-weight: 600; }
.rail .trig { display: flex; gap: 6px; align-items: baseline; margin-top: 6px; font-size: 12px; color: var(--text-3); }
.rail p { margin-top: 6px; color: var(--text-2); font-size: 13.5px; max-width: 18em; }

/* ---------- reference (agent mode) ---------- */
.ref .tabs { margin-bottom: 20px; }
.ref h3 { font-size: 13px; font-weight: 600; margin: 28px 0 8px; }
.ref h3:first-child { margin-top: 0; }
.ref .tbl { font-size: 12.5px; }
.ref .tbl td { color: var(--text-2); }
.pre { font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--text-2); background: var(--bg-subtle); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; }
.files { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
.files ul button { display: block; width: 100%; padding: 6px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.files ul button:hover { background: var(--bg-hover); }
.files ul button[aria-pressed="true"] { background: var(--bg-muted); color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 30; }
.empty { color: var(--text-3); }

/* ---------- depth: the second layer under each section ---------- */
.depth { margin-top: 36px; border-top: 1px solid var(--line); }
.depth__h { font-size: 12px; font-weight: 500; color: var(--text-3); padding: 14px 0 4px; }
.dp { border-bottom: 1px solid var(--line); }
.dp > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 11px 4px; border-radius: var(--r-sm); }
.dp > summary::-webkit-details-marker { display: none; }
.dp > summary:hover { background: var(--bg-hover); }
.dp > summary b { font-weight: 500; }
.dp > summary small { color: var(--text-3); font-size: 12.5px; margin-left: 6px; font-weight: 400; }
.dp > summary .kind { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.dp > summary .chev { transform: translateY(2px); }
.dp[open] > summary .chev { transform: translateY(2px) rotate(90deg); }
.dp__body { padding: 4px 4px 22px 30px; display: grid; gap: 12px; min-width: 0; }
.dp__lead { color: var(--text-2); max-width: 46em; }
.dp__body p.txt { color: var(--text-2); max-width: 46em; line-height: 22px; }
.dp__body ul.lst, .dp__body ol.lst { display: grid; gap: 6px; max-width: 52em; }
.dp__body ul.lst li { display: flex; gap: 10px; align-items: baseline; color: var(--text-2); }
.dp__body ul.lst li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); flex: none; transform: translateY(-2px); }
.dp__body ol.lst { counter-reset: n; }
.dp__body ol.lst li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; color: var(--text-2); counter-increment: n; }
.dp__body ol.lst li::before { content: counter(n); font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.lst b { color: var(--text); font-weight: 500; }
.src { display: inline-flex; gap: 4px; align-items: baseline; font-size: 12px; color: var(--text-3); max-width: 100%; }
.src span { color: var(--accent-text); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; overflow-wrap: anywhere; }
.src:hover span { text-decoration-color: currentColor; }
.tbl tr.has-detail { cursor: pointer; }
.tbl tr.has-detail:hover td { background: var(--bg-hover); }
.tbl tr.has-detail td:first-child::before { content: "+"; display: inline-block; width: 14px; color: var(--text-3); }
.tbl tr.has-detail[aria-expanded="true"] td:first-child::before { content: "\2212"; }
.tbl tr.detail td { color: var(--text-2); background: var(--bg-subtle); padding: 10px 14px; white-space: normal; }
.tbl th button { font: inherit; color: inherit; }
.tbl th button:hover { color: var(--text); }
.tbl td a, .tbl td button.cellbtn { color: var(--accent-text); text-align: left; }
.tbl td button.cellbtn:hover, .tbl td a:hover { text-decoration: underline; text-underline-offset: 3px; }
.tblbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tblbar input, .tblbar select { height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); font-size: 13px; }
.tblbar input { width: min(280px, 100%); }
.codebox { position: relative; }
.codebox .pre { max-height: 60vh; }
.codebox .btn { position: absolute; top: 8px; right: 8px; height: 28px; }
/* figures inside depth or as a surface */
.fsteps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; counter-reset: s; }
.fsteps li { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: grid; gap: 2px; align-content: start; }
.fsteps li b { font-weight: 500; font-size: 13.5px; line-height: 18px; }
.fsteps li .v { font: 500 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.fsteps li small { font-size: 12px; color: var(--text-3); }
.fsteps li .n { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fstack__bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; gap: 2px; }
.fstack__bar i { min-width: 3px; }
.fstack__leg { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 24px; font-size: 13px; color: var(--text-2); }
.fstack__leg div { display: flex; gap: 8px; align-items: center; }
.fstack__leg i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.fstack__leg b { margin-left: auto; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.fstack__tot { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }
.fstack__tot b { font: 500 22px/1 var(--font-display); color: var(--text); font-variant-numeric: tabular-nums; }
.fbars { display: grid; gap: 8px; }
.fbars div { display: grid; grid-template-columns: minmax(0, 14em) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; }
.fbars span { color: var(--text-2); }
.fbars i { display: block; height: 10px; border-radius: 3px; background: var(--series-2); }
.fbars b { font-weight: 500; font-variant-numeric: tabular-nums; }
.flayers { display: grid; gap: 6px; max-width: 760px; }
.flayers div { display: grid; grid-template-columns: minmax(0, 12em) minmax(0, 1fr); gap: 16px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); }
.flayers div:nth-child(2) { margin: 0 12px; } .flayers div:nth-child(3) { margin: 0 24px; } .flayers div:nth-child(4) { margin: 0 36px; } .flayers div:nth-child(n+5) { margin: 0 48px; }
.flayers b { font-weight: 500; }
.flayers span { color: var(--text-2); font-size: 13px; }
.fline svg { width: 100%; overflow: visible; }
/* inventory, cards, research cards, ops */
.inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px; }
.inv h3 { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.inv h3 small { margin-left: auto; color: var(--text-3); font-weight: 400; }
.inv li { padding: 9px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.inv li b { font-weight: 500; }
.inv li span { color: var(--text-2); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); display: grid; gap: 6px; align-content: start; background: var(--bg); }
.card b { font-weight: 600; line-height: 20px; }
.card p { color: var(--text-2); font-size: 13.5px; }
.card dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 12.5px; margin-top: 4px; }
.card dt { color: var(--text-3); } .card dd { color: var(--text); }
button.card { text-align: left; width: 100%; }
button.card:hover { border-color: var(--text-3); }
.card .cert { margin-top: 4px; }
.count { font: 500 40px/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.count + p { color: var(--text-2); margin-top: 6px; }
/* plan board */
.totals { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--text-2); }
.totals b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.cpath { margin-top: 22px; }
.cpath h3, .pb h3.sub2 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 8px; }
.pbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 28px 0 16px; }
.wband { border-top: 1px solid var(--line); padding: 18px 0 22px; }
.wband__h { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.wband__h b { font: 600 16px/22px var(--font-display); letter-spacing: -.01em; }
.wband__h span.when { color: var(--text-3); font-size: 12.5px; margin-left: 8px; font-weight: 400; font-family: var(--font-sans); letter-spacing: 0; }
.wband__h p { grid-column: 2; color: var(--text-2); font-size: 13.5px; }
.wband__h .st { grid-row: 1; grid-column: 3; }
.wband .more { margin: 8px 0 0 54px; }
.wband .more ul { margin-top: 6px; display: grid; gap: 4px; color: var(--text-2); font-size: 13.5px; max-width: 60em; }
.wband .more h4 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-top: 10px; }
.prgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin: 14px 0 0 54px; }
.prc { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 12px 6px; background: var(--bg); min-width: 0; }
.prc__h { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.prc__h b { font-weight: 600; font-size: 13.5px; line-height: 18px; }
.prc__h small { color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
.trow { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 2px; border-radius: var(--r-sm); font-size: 13px; text-align: left; }
.trow:hover { background: var(--bg-hover); }
.trow .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.trow .h { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.gate { margin: 10px 0 0 54px; display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--text-2); padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.gate b { color: var(--text); font-weight: 500; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 500; background: var(--bg-muted); color: var(--text-2); white-space: nowrap; }
.tag.hard { background: var(--text); color: var(--bg); }
.gpic { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; margin-top: 28px; }
.gpic li { position: relative; padding-right: 18px; }
.gpic li + li::before { content: ""; position: absolute; left: -18px; width: 18px; top: 22px; height: 1px; background: var(--line-strong); }
.gpic div { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 10px 12px; min-height: 64px; }
.gpic b { display: block; font-weight: 500; font-size: 13.5px; }
.gpic span { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
.counters { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.counters div { padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.counters b { display: block; font: 500 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.counters span { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.counters small { display: block; font-size: 11.5px; color: var(--text-3); }
.kick__go { margin-top: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.kick__go .btn--pri { height: 40px; padding: 0 18px; font-size: 14px; }
.ready { margin-top: 24px; max-width: 760px; }
.ready h3 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
.ready li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--text-2); }
.toc { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px 28px; }
.toc h3 { font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.toc a { display: block; padding: 3px 0; font-size: 13.5px; }
.toc a small { display: block; color: var(--text-3); font-size: 12px; }
.toc a:hover b { color: var(--accent-text); }
.toc b { font-weight: 500; }
/* ticket drawer and file viewer */
.tdrawer { position: fixed; z-index: 35; top: 52px; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); overflow-y: auto; overscroll-behavior: contain; padding: 18px 24px 48px; }
.tdrawer__bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tdrawer h2 { font-size: 22px; }
.tdrawer h4 { font-size: 12px; font-weight: 500; color: var(--text-3); margin: 18px 0 6px; }
.tdrawer p { color: var(--text-2); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin-top: 14px; font-size: 13px; }
.facts div { display: grid; gap: 1px; min-width: 0; }
.facts dt { color: var(--text-3); font-size: 12px; }
.facts dd { color: var(--text); overflow-wrap: anywhere; }
.tdrawer .flist { display: grid; gap: 2px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.tdrawer .tlinks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.viewer { width: min(920px, 94vw); max-height: 86vh; padding: 0; border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface); color: var(--text); }
.viewer::backdrop { background: var(--scrim); }
.viewer__bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.viewer__bar b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.viewer .pre { border: 0; border-radius: 0; max-height: none; margin: 0; background: var(--surface); }
/* ---------- agent mode: a separate, dense, monochrome workspace ---------- */
#aws { display: none; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 52px); }
:root[data-mode="agent"] #aws { display: grid; }
:root[data-mode="agent"] { --accent: var(--text); --accent-text: var(--text); --accent-soft: var(--bg-muted); --accent-ring: var(--line-strong); --ok: var(--text); --warn: var(--text); --err: var(--text); }
:root[data-mode="agent"] body { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: -.01em; }
:root[data-mode="agent"] .mark, :root[data-mode="agent"] .seg button, :root[data-mode="agent"] .btn { font-family: var(--font-mono); font-size: 12px; }
.tree { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); padding: 10px 8px 40px; font-size: 12px; background: var(--bg); }
.tree .gh { color: var(--text-3); padding: 12px 8px 3px; }
.tree button { display: flex; width: 100%; height: 25px; align-items: center; gap: 8px; padding: 0 8px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.tree button span:first-child { overflow: hidden; text-overflow: ellipsis; }
.tree button:hover { background: var(--bg-muted); }
.tree button[aria-current="true"] { background: var(--text); color: var(--bg); }
.tree button .sz { margin-left: auto; color: var(--text-3); flex: none; }
.tree button[aria-current="true"] .sz { color: var(--bg); }
.pane { padding: 14px 24px 80px; min-width: 0; }
.pane__start { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding: 8px 10px; border: 1px solid var(--text); border-radius: 3px; }
.pane__start b { font-weight: 600; }
.pane__meta { display: flex; flex-wrap: wrap; gap: 2px 16px; color: var(--text-3); margin: 8px 0 14px; }
.pane__head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 10px; }
.pane__head b { font-weight: 600; overflow-wrap: anywhere; }
.pane__head span { color: var(--text-3); }
.abtn { height: 26px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 3px; font-size: 12px; white-space: nowrap; }
.abtn:hover { background: var(--bg-muted); }
.pane input.afind { height: 26px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg); font: inherit; width: min(320px, 100%); }
.atbl-wrap { overflow: auto; max-width: 100%; max-height: calc(100vh - 220px); border: 1px solid var(--line); }
table.atbl { border-collapse: collapse; font-size: 11.5px; min-width: 100%; }
.atbl th { position: sticky; top: 0; background: var(--bg-muted); text-align: left; font-weight: 600; white-space: nowrap; }
.atbl th, .atbl td { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 6px; vertical-align: top; line-height: 17px; }
.atbl td { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 26px; }
.atbl th button { font: inherit; font-weight: 600; }
.atbl tr.rec td { white-space: normal; max-width: none; }
.atbl tr.arow { cursor: pointer; }
.atbl tr.arow:hover td { background: var(--bg-muted); }
.atbl tr.arow[aria-expanded="true"] td { background: var(--text); color: var(--bg); }
.atbl tr.rec td { background: var(--bg-subtle); }
.atbl tr.rec pre { white-space: pre-wrap; margin: 0; font: inherit; }
.araw { margin: 0; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; font: 12px/19px var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; max-height: calc(100vh - 210px); min-height: 160px; background: var(--bg-subtle); color: var(--text); }
.araw.img img { filter: grayscale(1); max-height: 60vh; }
@media (max-width: 1023px) {
  #aws, :root[data-mode="agent"] #aws { grid-template-columns: minmax(0, 1fr); }
  .tree { position: fixed; z-index: 25; top: 52px; left: 0; bottom: 0; height: auto; width: min(340px, 88vw); transform: translateX(-102%); visibility: hidden; transition: transform 200ms cubic-bezier(.2,0,0,1), visibility 0s 200ms; box-shadow: 0 8px 24px rgba(0,0,0,.14); }

  .wave .ring { grid-row: span 3; }

  .wave .what { max-width: none; }
