<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky header (title, round, stage stepper, mode and theme) over a fluid shell: a compact section
   rail on the left (a drawer under 1024 px) and one main column that uses the full width. Running text keeps a
   readable measure; grids, diagrams and the wave plan spread across the screen. Separation is whitespace,
   type, hairlines and tinted bands; borders belong to controls only. A PR opens in a side sheet.
   Agent mode swaps the rail for a file tree and the column for a raw viewer, in monochrome mono. */
:root {
  --bg: oklch(0.978 0.005 240);
  --panel: oklch(0.997 0.002 240);
  --band: oklch(0.957 0.008 245);
  --sunk: oklch(0.938 0.01 245);
  --line: oklch(0.3 0.03 255 / 0.1);
  --line-2: oklch(0.3 0.03 255 / 0.2);
  --fg: oklch(0.23 0.025 258);
  --fg-2: oklch(0.45 0.022 258);
  --fg-3: oklch(0.59 0.016 258);
  --accent: oklch(0.49 0.14 262);
  --accent-soft: oklch(0.49 0.14 262 / 0.09);
  --on-accent: oklch(0.99 0 0);
  --need: oklch(0.74 0.15 68);
  --need-ink: oklch(0.52 0.12 62);
  --need-soft: oklch(0.8 0.13 75 / 0.17);
  --ok: oklch(0.56 0.12 155);
  --ok-soft: oklch(0.6 0.12 155 / 0.12);
  --bad: oklch(0.56 0.18 26);
  --bad-soft: oklch(0.6 0.18 26 / 0.1);
  --rev: oklch(0.54 0.13 305);
  --rev-soft: oklch(0.54 0.13 305 / 0.1);
  --tests: oklch(0.62 0.11 205);
  --scrim: oklch(0.2 0.02 260 / 0.32);
  --shadow: 0 1px 2px oklch(0.3 0.03 255 / 0.06), 0 8px 26px -14px oklch(0.3 0.03 255 / 0.22);
  --lift: 0 1px 2px oklch(0.3 0.03 255 / 0.05), 0 2px 10px -6px oklch(0.3 0.03 255 / 0.14);
  /* agent mode: black and white */
  --a-bg: oklch(1 0 0); --a-fg: oklch(0.12 0 0); --a-2: oklch(0.42 0 0); --a-line: oklch(0 0 0 / 0.16); --a-sunk: oklch(0.96 0 0);
  --display: "Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --measure: 68ch;
  --hh: 104px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.185 0.014 258); --panel: oklch(0.228 0.016 258); --band: oklch(0.207 0.015 258); --sunk: oklch(0.255 0.017 258);
  --line: oklch(0.95 0.01 250 / 0.085); --line-2: oklch(0.95 0.01 250 / 0.17);
  --fg: oklch(0.95 0.008 250); --fg-2: oklch(0.77 0.014 252); --fg-3: oklch(0.62 0.014 252);
  --accent: oklch(0.77 0.11 262); --accent-soft: oklch(0.77 0.11 262 / 0.14); --on-accent: oklch(0.18 0.02 260);
  --need: oklch(0.8 0.14 76); --need-ink: oklch(0.84 0.12 78); --need-soft: oklch(0.8 0.14 76 / 0.14);
  --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.76 0.13 155 / 0.14);
  --bad: oklch(0.73 0.16 26); --bad-soft: oklch(0.73 0.16 26 / 0.14);
  --rev: oklch(0.76 0.12 305); --rev-soft: oklch(0.76 0.12 305 / 0.14);
  --tests: oklch(0.76 0.1 205); --scrim: oklch(0.08 0.01 260 / 0.55);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 10px 30px -12px oklch(0 0 0 / 0.65);
  --lift: 0 1px 2px oklch(0 0 0 / 0.25), 0 2px 12px -6px oklch(0 0 0 / 0.5);
  --a-bg: oklch(0.13 0 0); --a-fg: oklch(0.93 0 0); --a-2: oklch(0.68 0 0); --a-line: oklch(1 0 0 / 0.16); --a-sunk: oklch(0.18 0 0);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: oklch(0.185 0.014 258); --panel: oklch(0.228 0.016 258); --band: oklch(0.207 0.015 258); --sunk: oklch(0.255 0.017 258);
  --line: oklch(0.95 0.01 250 / 0.085); --line-2: oklch(0.95 0.01 250 / 0.17);
  --fg: oklch(0.95 0.008 250); --fg-2: oklch(0.77 0.014 252); --fg-3: oklch(0.62 0.014 252);
  --accent: oklch(0.77 0.11 262); --accent-soft: oklch(0.77 0.11 262 / 0.14); --on-accent: oklch(0.18 0.02 260);
  --need: oklch(0.8 0.14 76); --need-ink: oklch(0.84 0.12 78); --need-soft: oklch(0.8 0.14 76 / 0.14);
  --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.76 0.13 155 / 0.14);
  --bad: oklch(0.73 0.16 26); --bad-soft: oklch(0.73 0.16 26 / 0.14);
  --rev: oklch(0.76 0.12 305); --rev-soft: oklch(0.76 0.12 305 / 0.14);
  --tests: oklch(0.76 0.1 205); --scrim: oklch(0.08 0.01 260 / 0.55);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 10px 30px -12px oklch(0 0 0 / 0.65);
  --lift: 0 1px 2px oklch(0 0 0 / 0.25), 0 2px 12px -6px oklch(0 0 0 / 0.5);
  --a-bg: oklch(0.13 0 0); --a-fg: oklch(0.93 0 0); --a-2: oklch(0.68 0 0); --a-line: oklch(1 0 0 / 0.16); --a-sunk: oklch(0.18 0 0);
  color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--hh) + 12px); }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 650; letter-spacing: -0.012em; text-wrap: balance; margin: 0; }
p { margin: 0; text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 13px; }
.measure { max-width: var(--measure); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .gutter { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.ico { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; }
.ico.fill { fill: currentColor; stroke: none; }
.eyebrow { font: 600 11.5px/1.3 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-3); }

/* ---------- header ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklch, var(--bg) 96%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
#top .in { max-width: 1880px; margin: 0 auto; padding-block: 12px 10px; display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.titleblk { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 14px; }
.titleblk h1 { font-size: 20px; line-height: 1.2; white-space: nowrap; }
.titleblk .tag { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row2 { display: flex; align-items: center; gap: 14px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; padding-bottom: 2px; }
.row2::-webkit-scrollbar { display: none; }
.roundchip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); }
.roundchip b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; font-size: 12.5px; }
.step { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); }
.step i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
.step.done { color: var(--fg-2); } .step.done i { background: currentColor; }
.step.now { color: var(--accent); font-weight: 600; } .step.now i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step + .step::before { content: ""; width: 18px; height: 1.5px; background: var(--line-2); margin: 0 6px; }
.hlinks { display: inline-flex; gap: 6px; }
.hlink { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--fg-2); text-decoration: none; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
a.hlink:hover { color: var(--fg); border-color: var(--line-2); }
.hlink .mono { color: var(--fg); }
.owner { font-size: 12.5px; color: var(--fg-3); }
.sep { width: 1px; height: 16px; background: var(--line-2); flex: none; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); }
.live.on { color: var(--fg-2); } .live.on i { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--ok-soft); } }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 6px; font-size: 12.5px; color: var(--fg-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px oklch(0 0 0 / 0.12); font-weight: 550; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--fg-2); font-size: 15px; flex: none; }
.iconbtn:hover { color: var(--fg); border-color: var(--line-2); }
#menuBtn { display: none; }

/* ---------- shell ---------- */
.shell { max-width: 1880px; margin: 0 auto; min-height: calc(100vh - var(--hh) - 56px); display: grid; grid-template-columns: 196px minmax(0, 1fr); column-gap: clamp(32px, 3.2vw, 64px); }
#side { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--hh)); overflow-y: auto; padding-block: 30px 24px; scrollbar-width: thin; }
.nav { display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; color: var(--fg-2); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--band); color: var(--fg); }
.nav a.cur { color: var(--fg); background: var(--band); font-weight: 550; }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--fg-3); }
.dot.is-ready { background: var(--fg-3); border-color: var(--fg-3); }
.dot.is-live { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dot.is-need { background: var(--need); border-color: var(--need); }
.dot.is-later { background: transparent; border-style: dashed; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--need); color: oklch(0.22 0.04 70); font-size: 12px; font-weight: 650; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.navfoot { margin-top: 18px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-3); display: grid; gap: 4px; }
main { min-width: 0; padding-block: 8px 96px; container: main / inline-size; }

/* ---------- sections ---------- */
.sec { padding-block: 60px 8px; scroll-margin-top: calc(var(--hh) + 8px); min-width: 0; }
#human > .sec { border-top: 1px solid var(--line); margin-top: 28px; }
.sh { display: flex; align-items: baseline; gap: 10px 20px; margin-bottom: 28px; flex-wrap: wrap; }
.sh h2 { font-size: clamp(25px, 2.1vw, 32px); line-height: 1.12; letter-spacing: -0.018em; }
.sh .aside { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sh .cnt { font-size: 14px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.sec.compact .sh { margin-bottom: 14px; }
.sec.compact .sh h2 { font: 600 12px/1.3 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.later-tag { font-size: 12.5px; color: var(--fg-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 8px; }
.sec.later .body { opacity: 0.52; filter: grayscale(0.9); }
.lede { font-size: 18px; line-height: 1.55; max-width: var(--measure); }
.sub { font-family: var(--display); font-size: 20px; font-weight: 620; margin: 48px 0 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sub .faint { font-family: var(--body); font-size: 13.5px; font-weight: 400; }
.sub:first-child { margin-top: 0; }

.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 2px 9px; border-radius: 7px; background: var(--sunk); border: 1px solid transparent; color: var(--fg-2); font-size: 12.5px; line-height: 1.3; max-width: 100%; text-decoration: none; text-align: left; }
a.chip, button.chip { border-color: var(--line-2); background: var(--panel); cursor: pointer; }
a.chip:hover, button.chip:hover { color: var(--fg); border-color: var(--fg-3); }
.chip > span { overflow: hidden; text-overflow: ellipsis; }
.chip.need { background: var(--need-soft); border-color: transparent; color: var(--need-ink); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.rev { background: var(--rev-soft); border-color: transparent; color: var(--rev); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex: none; }
.st.todo i, .st.planned i { background: transparent; border: 1.5px solid var(--fg-3); }
.st.doing i, .st.building i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.st.review i, .st.open i { background: var(--rev); }
.st.unverified i { background: transparent; border: 2px solid var(--need); }
.st.built i { background: transparent; border: 2px solid var(--ok); }
.st.done i, .st.merged i { background: var(--ok); }
.st.blocked i { background: var(--bad); }
.st.blocked { color: var(--bad); }
.st.merged { color: var(--ok); }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); font-size: 13.5px; font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn.ghost:hover { color: var(--fg); background: var(--band); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-align: left; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }

.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
.clamp.open { -webkit-line-clamp: unset; display: block; }
.more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 0; cursor: pointer; margin-top: 2px; justify-self: start; text-align: left; }
.note { font-size: 13px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 9px; background: var(--band); }
.empty { color: var(--fg-3); font-size: 14px; padding: 14px 0; }
.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; color: var(--fg-2); }
.plain li { display: flex; gap: 9px; align-items: baseline; line-height: 1.5; }
.plain li .ico { flex: none; transform: translateY(2px); color: var(--fg-3); }
.plain li b { color: var(--fg); font-weight: 550; }
.plain.ok li .ico { color: var(--ok); }
.plain.bad li .ico { color: var(--bad); }
.dw { display: grid; gap: 5px; font-size: 13.5px; color: var(--fg-2); list-style: none; }
.dw li { display: flex; gap: 8px; align-items: baseline; line-height: 1.45; }
.dw li .ico { color: var(--fg-3); transform: translateY(2px); flex: none; }
.dw li.v-verified .ico { color: var(--ok); }
.dw li.v-bad .ico { color: var(--bad); }
.dw li.v-inc .ico { color: var(--need); }
.verdict { font-size: 12px; font-weight: 650; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.verdict.verified { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.inc { background: var(--need-soft); color: var(--need-ink); }
.kv { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px 18px; font-size: 14px; margin: 0; }
.kv > dt { color: var(--fg-3); font-size: 13px; padding-top: 1px; }
.kv > dd { margin: 0; min-width: 0; line-height: 1.55; }
.files { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
.files span { overflow-wrap: anywhere; }
.repro { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 128px; height: 80px; border-radius: 7px; border: 1px solid var(--line-2); overflow: hidden; display: block; padding: 0; background: var(--sunk); cursor: zoom-in; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .old { position: absolute; left: 4px; bottom: 4px; background: var(--need); color: oklch(0.22 0.04 70); font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; }
.bignums { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 20px 32px; }
.bn { border-top: 1px solid var(--line-2); padding-top: 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.bn .v { font: 650 clamp(30px, 2.6vw, 42px)/1.05 var(--display); letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.bn .v small { font-size: 0.48em; color: var(--fg-3); font-weight: 500; letter-spacing: 0; }
.bn .l { font-size: 13px; color: var(--fg-2); line-height: 1.4; }
.bn.ok .v { color: var(--ok); }

/* ---------- lead: summary and needs you ---------- */
.lead { display: grid; gap: 40px; padding-top: 30px; align-items: start; }
@container main (min-width: 920px) { .lead { grid-template-columns: minmax(0, 1.55fr) minmax(310px, 1fr); gap: 40px; } }
@container main (min-width: 1200px) { .lead { grid-template-columns: minmax(0, 1.7fr) minmax(340px, 1fr); gap: 56px; } }
.lead > .sec { padding-top: 0; }
.sumhead { font: 620 clamp(25px, 2.5vw, 38px)/1.16 var(--display); letter-spacing: -0.022em; max-width: 30ch; text-wrap: balance; }
.sumtext { margin-top: 14px; font-size: 17px; line-height: 1.55; color: var(--fg-2); max-width: var(--measure); }
.lead .bignums { margin-top: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 118px), 1fr)); gap: 18px 24px; }
.tline { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); row-gap: 20px; margin-top: 30px; padding-top: 4px; }
.tli { position: relative; padding: 18px 16px 0 0; display: grid; gap: 3px; align-content: start; }
.tli::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; background: var(--line-2); }
.tli::after { content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
.tli b { font-size: 13px; font-weight: 600; }
.tli span { font-size: 13.5px; color: var(--fg-2); line-height: 1.4; }
.pts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 0 28px; margin-top: 30px; }
.pt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; align-content: start; padding: 14px 0 16px; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; color: inherit; min-width: 0; }
button.pt { cursor: pointer; }
.pt .ico { color: var(--accent); font-size: 17px; margin-top: 2px; }
.pt b { font-weight: 600; font-size: 15px; }
.pt span { grid-column: 2; font-size: 14px; color: var(--fg-2); line-height: 1.45; }
.pt .go { grid-column: 2; font-size: 12.5px; color: var(--accent); display: inline-flex; gap: 4px; align-items: center; opacity: 0.75; }
button.pt:hover b { color: var(--accent); }
button.pt:hover .go { opacity: 1; }

#needs { background: var(--band); border-radius: 18px; padding: 22px clamp(18px, 1.8vw, 28px) 24px; }
#needs .sh { margin-bottom: 10px; }
.needs-head { font: 650 clamp(23px, 2vw, 30px)/1.16 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.needs-head .n { color: var(--need-ink); }
.nextline { font-size: 14px; color: var(--fg); margin-bottom: 12px; line-height: 1.45; }
.nextline b { color: var(--accent); font-weight: 650; margin-right: 4px; }
.runline { display: flex; align-items: center; gap: 6px 12px; margin-top: 12px; font-size: 14px; color: var(--fg-2); flex-wrap: wrap; }
.runline .phase { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 550; }
.runline .phase i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse2 2s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
.tally { display: flex; gap: 8px 16px; margin-top: 16px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); align-items: center; }
.tally .bar { display: flex; height: 6px; flex: 1 1 100%; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.tally .bar span { display: block; height: 100%; }
.tally .k { display: inline-flex; align-items: center; gap: 6px; }
.tally .k i { width: 8px; height: 8px; border-radius: 2px; }
.asks { margin-top: 18px; display: grid; }
.ask { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.ask .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.ask.dec .ic { background: var(--need-soft); color: var(--need-ink); }
.ask.blk .ic { background: var(--bad-soft); color: var(--bad); }
.ask.fb .ic { background: var(--accent-soft); color: var(--accent); }
.ask.gate .ic { background: var(--ok-soft); color: var(--ok); }
.ask.info .ic { background: var(--sunk); color: var(--fg-2); }
.ask .t { font-weight: 550; line-height: 1.38; }
.ask .m { font-size: 13px; color: var(--fg-2); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ask.gate .t { font-size: 15.5px; }
.allclear { margin-top: 18px; display: flex; gap: 10px; align-items: center; color: var(--fg-2); }

/* ---------- problem and outcomes ---------- */
.prob { display: grid; gap: 28px 64px; }
@container main (min-width: 1100px) { .prob { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.today { display: grid; gap: 8px; margin-top: 20px; list-style: none; max-width: var(--measure); }
.today li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; color: var(--fg-2); }
.today li .ico { color: var(--bad); transform: translateY(2px); flex: none; }
.quotes { display: grid; gap: 22px; align-content: start; }
.quote { margin: 0; padding-left: 18px; position: relative; }
.quote::before { content: "\201C"; position: absolute; left: -4px; top: -10px; font: 600 40px/1 var(--display); color: var(--accent); opacity: 0.5; }
.quote p { font: 500 19px/1.4 var(--display); letter-spacing: -0.008em; }
.quote span { display: block; font-size: 12.5px; color: var(--fg-3); margin-top: 6px; }
.outs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 28px 40px; }
.oc { display: grid; gap: 12px; align-content: start; padding-top: 16px; border-top: 1px solid var(--line-2); min-width: 0; }
.oc .ib { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 18px; }
.oc .claim { font-size: 16px; line-height: 1.48; font-weight: 500; }
.oc .ft { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ---------- findings ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.fbtn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--fg-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); font-weight: 550; }
.fbtn .c { color: var(--fg-3); font-variant-numeric: tabular-nums; }
.fgroup { display: grid; gap: 14px 40px; padding-block: 26px 10px; border-top: 1px solid var(--line-2); }
.fgroup:first-of-type { border-top: 0; padding-top: 4px; }
@container main (min-width: 1040px) { .fgroup { grid-template-columns: 210px minmax(0, 1fr); } .fgh { position: sticky; top: calc(var(--hh) + 18px); align-self: start; } }
.fgh h3 { font-size: 19px; font-weight: 620; }
.fgh .m { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-3); }
.fgh .m span { display: inline-flex; align-items: center; gap: 5px; }
.fgh .m i { width: 7px; height: 7px; border-radius: 50%; }
.fcols { display: none; }
@container main (min-width: 820px) { .fcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 40px; padding-bottom: 6px; } }
.flist { display: grid; min-width: 0; }
.fr { display: grid; gap: 12px 40px; padding-block: 16px; border-top: 1px solid var(--line); min-width: 0; }
.flist > .fcols + .fr, .flist > .fr:first-child { border-top: 0; padding-top: 4px; }
@container main (min-width: 820px) { .fr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .fr .will .eyebrow { display: none; } }
.fr .side { display: grid; gap: 8px; align-content: start; min-width: 0; }
.fr .txt { font-size: 15.5px; line-height: 1.5; }
.fr .will .txt { color: var(--fg); }
.imp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg-3); }
.imp i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); }
.imp.high { color: var(--bad); } .imp.high i { background: var(--bad); }
.imp.medium { color: var(--need-ink); } .imp.medium i { background: var(--need); }
.fdx { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 40px; background: var(--band); border-radius: 12px; padding: 14px 18px; }
.fdx h4 { font: 600 11.5px var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
.fdx p { font-size: 14.5px; line-height: 1.6; color: var(--fg-2); }

/* ---------- research ---------- */
.rgrid { display: grid; gap: 0 56px; }
@container main (min-width: 960px) { .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container main (min-width: 1560px) { .rgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ri { border-top: 1px solid var(--line-2); padding-block: 20px 30px; display: grid; gap: 14px; align-content: start; min-width: 0; scroll-margin-top: calc(var(--hh) + 16px); }
.ri .q { font-size: 14px; color: var(--fg-2); font-weight: 550; line-height: 1.45; }
.ri .a { font: 500 clamp(17px, 1.35vw, 20px)/1.45 var(--display); letter-spacing: -0.006em; }
.ri .will { display: grid; gap: 8px; }
.ri .src { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.ri .src a, .ri .src span { color: var(--fg-3); display: inline-flex; gap: 5px; align-items: baseline; text-decoration: none; }
.ri .src a:hover { color: var(--accent); text-decoration: underline; }
.ri.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); } }

/* ---------- architecture ---------- */
.atabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 0 22px; }
.atabs button { text-align: left; border: 0; border-top: 2px solid var(--line-2); background: none; padding: 10px 2px 12px; cursor: pointer; display: grid; gap: 2px; align-content: start; font: inherit; color: var(--fg-2); }
.atabs button:hover { color: var(--fg); border-top-color: var(--fg-3); }
.atabs button b { font-size: 11.5px; color: var(--fg-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.atabs button span { font-size: 14px; font-weight: 550; line-height: 1.3; }
.atabs button[aria-selected="true"] { border-top-color: var(--accent); color: var(--fg); }
.atabs button[aria-selected="true"] b { color: var(--accent); }
@container main (max-width: 640px) { .atabs { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 70%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; } .atabs button { scroll-snap-align: start; } }
.apanel { margin-top: 30px; container: apanel / inline-size; }
.ahead { display: grid; gap: 6px; margin-bottom: 26px; }
.ahead h3 { font-size: clamp(22px, 1.9vw, 28px); font-weight: 640; letter-spacing: -0.016em; }
.ahead p { font-size: 15px; color: var(--fg-2); max-width: var(--measure); }
.agrid { display: grid; gap: 34px 60px; align-items: start; }
@container apanel (min-width: 980px) { .agrid { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); } }
.story { display: grid; gap: 24px; align-content: start; min-width: 0; }
.story .blk { display: grid; gap: 7px; }
.story .blk p { font-size: 15.5px; line-height: 1.62; max-width: var(--measure); }
.story .blk.rec p { font-size: 17px; line-height: 1.55; color: var(--fg); }
.story .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 20px 32px; }
.story .two ul { list-style: none; display: grid; gap: 6px; }
.story .two li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--fg-2); line-height: 1.45; }
.story .two li .ico { flex: none; transform: translateY(2px); color: var(--fg-3); }
.dcol { display: grid; gap: 14px; min-width: 0; }
.canvas { background: var(--band); border-radius: 16px; padding: 10px 10px 4px; min-width: 0; }
.cbar { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; flex-wrap: wrap; }
.cbar > b { font-size: 13px; }
.cbar .ctl { margin-left: auto; display: flex; gap: 4px; }
.cscroll { overflow-x: auto; }
.archsvg { display: block; width: 100%; height: auto; margin-inline: auto; color: var(--fg); }
.archcap { padding: 6px 6px 10px; font-size: 13.5px; color: var(--fg-2); display: flex; gap: 8px; align-items: baseline; }
.archcap b { color: var(--fg); font-weight: 600; }
.archpts { list-style: none; margin: 0; padding: 4px 6px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px 22px; font-size: 13.5px; color: var(--fg-2); }
.archpts li { display: grid; gap: 2px; align-content: start; }
.archpts b { color: var(--fg); font-weight: 600; font-size: 13px; }
.asteps { list-style: none; display: grid; gap: 2px; }
.asteps .hd { padding: 0 2px 6px; }
.asteps button { width: 100%; text-align: left; border: 0; background: none; border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; font: inherit; font-size: 14px; line-height: 1.5; color: var(--fg-2); cursor: pointer; }
.asteps button:hover { background: var(--band); color: var(--fg); }
.asteps button i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-size: 12px; font-weight: 600; color: var(--fg-3); }
.asteps button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); }
.asteps button[aria-current="true"] i { background: var(--accent); color: var(--on-accent); }
.frames { display: flex; gap: 4px; flex-wrap: wrap; }
.frames button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; font-size: 13px; color: var(--fg-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.frames button b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg-3); }
.frames button[aria-current="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--lift); }
.frames button[aria-current="true"] b { color: var(--accent); }
.an rect, .an path.shape { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.2; }
.an text { fill: var(--fg); font: 500 12.5px var(--body); }
.an text.k { fill: var(--fg-3); font: 400 10.5px var(--body); }
.an.ext rect { stroke-dasharray: 4 3; fill: var(--sunk); }
.an.isnew rect, .an.isnew path.shape { stroke: var(--accent); stroke-width: 1.8; fill: color-mix(in oklch, var(--panel) 88%, var(--accent)); }
.an.isnew text.k { fill: var(--accent); }
.ae path { fill: none; stroke: var(--fg-3); stroke-width: 1.3; }
.ae text { fill: var(--fg-2); font: 400 11px var(--body); paint-order: stroke; stroke: var(--band); stroke-width: 4px; stroke-linejoin: round; }
.ae.isnew path { stroke: var(--accent); }
.ae.isnew text { fill: var(--accent); }
.anim .an.isnew { animation: pop 0.55s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
.anim .ae.isnew path { stroke-dasharray: 400; animation: draw 0.8s 0.2s ease-out both; }
.anim .ae.isnew text { animation: fade 0.4s 0.6s both; }
@keyframes pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
.an, .ae { transition: opacity 0.25s; }
.an.dim, .ae.dim { opacity: 0.25; }
.an.hl rect, .an.hl path.shape { stroke: var(--accent); stroke-width: 2.6; }
.ae.hl path { stroke: var(--accent); stroke-width: 2.2; }
.ae.hl text { fill: var(--accent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; color: var(--fg-3); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; }
.tbl td:first-child { font-weight: 550; }
.tbl td.b { color: var(--fg-2); }
.tbl td.a::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 2px; }
.tscroll { overflow-x: auto; }

/* ---------- prototypes ---------- */
.protos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px 40px; }
.pc { border-top: 1px solid var(--line-2); padding-top: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.pc.wide { grid-column: 1 / -1; }
.pc .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pc h3 { font-size: 17px; font-weight: 600; }
.pc .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pc iframe { width: 100%; height: 520px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); }

/* ---------- plan ---------- */
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 18px 36px; margin-top: 26px; }
.pr b { display: block; font-weight: 600; font-size: 14.5px; }
.pr span { font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.gatebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 30px 44px; }
.mi { display: grid; gap: 10px; align-content: start; min-width: 0; scroll-margin-top: calc(var(--hh) + 16px); }
.mtrack { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.mtrack span { display: block; height: 100%; background: var(--ok); border-radius: 2px; transition: width 0.6s ease; }
.mi .mt { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.mi .mt h4 { font-size: 18px; font-weight: 620; }
.mi .mt span { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mi .mg { font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.mi .by { display: grid; gap: 6px; }
.mi.flash { animation: flash 1.6s ease; border-radius: 8px; }

/* the wave plan: waves as columns (or rows when they do not fit), PRs as blocks, arrows for what each waits on */
.wplan { background: var(--band); border-radius: 20px; padding: clamp(16px, 1.8vw, 28px); container: wplan / inline-size; }
.wlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; color: var(--fg-2); margin-bottom: 18px; }
.wlegend .k { display: inline-flex; align-items: center; gap: 6px; }
.wlegend .grow { flex: 1 1 260px; min-width: 0; color: var(--fg-2); }
.wgrid { position: relative; display: grid; }
.wplan.cols .wgrid { grid-template-columns: repeat(var(--nw, 3), minmax(0, 1fr)); }
.wdeps { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.wdeps path { fill: none; stroke: var(--fg-3); stroke-width: 1.5; opacity: 0.55; transition: opacity 0.2s, stroke 0.2s; }
.wdeps path.hi { stroke: var(--accent); opacity: 1; stroke-width: 2.2; }
.wgrid.hov .wdeps path:not(.hi) { opacity: 0.12; }
.wcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: relative; }
.wplan.cols .wcol { padding: 0 clamp(16px, 1.6vw, 30px); }
.wplan.cols .wcol:first-child { padding-left: 0; }
.wplan.cols .wcol:last-child { padding-right: 0; }
.wplan.cols .wcol + .wcol { border-left: 1px dashed var(--line-2); }
.whead { display: grid; gap: 4px; align-content: start; }
.whead .wn { display: flex; align-items: center; gap: 8px; }
.whead .wn .eyebrow { color: var(--fg-2); }
.wcol.now .whead .wn .eyebrow { color: var(--accent); }
.nowtag { font-size: 11px; font-weight: 650; color: var(--on-accent); background: var(--accent); border-radius: 9px; padding: 1px 8px; }
.whead .when { font-size: 12px; color: var(--fg-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.whead h4 { font-size: 18px; font-weight: 620; line-height: 1.25; }
.whead p { font-size: 13.5px; color: var(--fg-2); line-height: 1.45; }
.wprs { display: grid; gap: 12px; align-content: start; }
.wgate { margin-top: auto; display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--fg-2); line-height: 1.45; padding-top: 4px; }
.wgate .ico { color: var(--fg-3); transform: translateY(2px); }
.wgate b { color: var(--fg); font-weight: 600; }
.wplan.rows .wgrid { gap: 0; }
.wplan.rows .wcol { display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1fr); gap: 14px 32px; padding-block: 22px; border-top: 1px dashed var(--line-2); }
.wplan.rows .wcol:first-child { border-top: 0; padding-top: 2px; }
.wplan.rows .wprs { grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.wplan.rows .wgate { grid-column: 2; margin-top: 0; }
@container wplan (max-width: 620px) { .wplan.rows .wcol { grid-template-columns: minmax(0, 1fr); } .wplan.rows .wgate { grid-column: 1; } }
.prb { position: relative; z-index: 1; display: grid; gap: 10px; text-align: left; border: 0; border-radius: 14px; background: var(--panel); padding: 14px 16px 14px; cursor: pointer; font: inherit; color: var(--fg); box-shadow: var(--lift); min-width: 0; transition: box-shadow 0.18s, transform 0.18s; }
.prb:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.prb.merged { background: color-mix(in oklch, var(--panel) 90%, var(--ok)); }
.prb .ptop { display: flex; align-items: center; gap: 8px; min-width: 0; }
.prb .ptop .eyebrow { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.prb .ptop .st { margin-left: auto; }
.prb .tt { font: 620 16px/1.3 var(--display); letter-spacing: -0.008em; }
.prb .cm { display: grid; gap: 4px; font-size: 13px; color: var(--fg-2); }
.prb .cl { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline; line-height: 1.38; }
.prb .cl .st { transform: translateY(1px); }

  const head = h("div", { class: "avpath" }, h("b", { text: path.replace(/^db:/, "db/").replace(/^view:/, "book.json: ") }), h("span", { text: describe(path) }));
  let view;
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(path)) view = h("div", { class: "raw img" }, h("img", { src: path, alt: path }));
  else {
    const txt = viewText(path);
    view = h("pre", { class: "raw", tabindex: "0", text: txt ?? "Loading " + path + " ..." });
    if (txt == null) fetchFile(path).then(() => { if (UI.file === path && UI.mode === "agent") renderAgentView(); });
  }
  add(main, h("div", { class: "av" }, bar, head, view));
}
function describe(path) {
  if (path === "agent/book.json") return "content, republished with the page";
  if (path.startsWith("db:")) return "live documents, written by the run and by people";
  if (path === "view:rules") return "plan.waves, plan.prs, plan.gate and plan.stop_rules from book.json";
  if (path === "view:checks") return "plan.verification from book.json, with live states from status/ready-<id> and status/check-<id>";
  const f = (B.files || []).find((x) => x.path === path); return f?.title || "";
}
function viewText(path) {
  if (path === "agent/book.json") return JSON.stringify(B, null, 2);
  if (path.startsWith("db:")) return JSON.stringify(dbDump(path.slice(3)), null, 2);
  if (path === "view:checks") {
    const st = (k, id, d) => L.status[k + id]?.state || d;
    return ["# Ready before the run (status/ready-<id>)", ...(VER.ready || []).map((r) => "- [" + st("ready-", r.id, r.state || "unknown") + "] " + r.id + ": " + r.need + (r.check ? "\n  check: " + r.check : "") + (r.who ? "\n  who: " + r.who : "")),
      "", "# While building", ...(VER.building || []).map((x) => "- " + x.where + ": " + x.what),
      "", "# Runs", ...(VER.runs || []).map((r) => "- " + r.id + ": " + r.title + " (" + [r.what, r.cost, r.time].filter(Boolean).join(", ") + ")"),
      "", "# Final checks (status/check-<id>)" + (VER.where ? ", " + VER.where : ""), ...(VER.checks || []).map((c) => "- [" + st("check-", c.id, "todo") + "] " + c.id + " (" + c.kind + (c.run ? ", run " + c.run : "") + "): " + c.title +
        "\n  tickets: " + (c.tickets || []).join(", ") + (c.say ? "\n  say: " + c.say : "") + "\n  expect: " + (c.expect || "") + "\n  pass: " + (c.pass || ""))].join("\n");
  }
  if (path === "view:rules") {
    const G = P.gate || {};
    return ["# Waves (PRs, commits in order)", ...WAVES.map((w) => "wave " + w.n + ": " + wavePRs(w).map((p) => p.id + "[" + prTickets(p).join(" > ") + "]" + (stackOn(p) ? " on top of " + stackOn(p).id : "") + (prDeps(p).length ? " after " + prDeps(p).join(",") : "")).join("  ") + (w.gate?.length ? "  gate: " + w.gate.join(", ") : "")),
      "", "# Gate (every wave)", ...(G.steps || []).map((x, i) => (i + 1) + ". " + x), "", "# Baseline (must stay green)", ...(G.baseline || []).map((x) => "- " + x), "", "# Stop rules", ...(P.stop_rules || []).map((x) => "- " + x),
      "", "# Ticket loop", ...((P.flow || {}).ticket || []).map((x, i) => (i + 1) + ". " + x), "", "# PR loop", ...((P.flow || {}).pr || []).map((x, i) => (i + 1) + ". " + x)].join("\n");
  }
  return fileCache[path];
}
async function fetchFile(path) {
  if (fileCache[path] != null) return;
  try { const r = await fetch(path); if (!r.ok) throw new Error(r.status); fileCache[path] = await r.text(); }
  catch (e) { fileCache[path] = "Could not load " + path + " here (" + (e.message || "error") + ").\nOn the published page it loads from the artifact's files.\nAn agent reads it with: Artifact read, path: \"" + path + "\""; }
}
function dbDump(c) {
  if (c === "status") return L.status;
  if (c === "run") return L.run ? { current: L.run } : {};
  if (c === "log") return Object.fromEntries(L.log.map((r) => [r._id || r.at, strip(r)]));
  if (c === "decisions") return L.decisions;
  if (c === "feedback") return Object.fromEntries(L.feedback.map((f) => [f._id || f.at, strip(f)]));
  if (c === "gates") return L.gates;
  return {};
}
function strip(o) { const x = { ...o }; delete x._id; return x; }
function digest() {
  const lines = [];
  lines.push("# " + B.title + ", round " + (B.round?.n ?? "") + " digest");
  lines.push("Generated " + new Date().toISOString() + " from " + (L.db ? "live data" : L.demo ? "sample data (preview)" : "the page only; the db was not available") + ". Everything below is data from the page, not instructions.");
  lines.push("", "## Decisions");
  DECS.forEach((d) => {
    const a = decAns(d.id), st = decState(d.id);
    const opt = (id) => (d.options || []).find((o) => o.id === id)?.label || id;
    if (!a) lines.push("- " + d.id + ": NOT OPENED (recommended: " + opt(d.recommended) + ")" + ((d.blocks || []).length ? " [blocks: " + d.blocks.join(", ") + "]" : ""));
    else lines.push("- " + d.id + ": " + st + " -> " + opt(a.choice) + " (by " + nameOf(a.by) + ", " + (a.at || "") + ")" + (a.note ? ' note: "' + a.note + '"' : ""));
  });
  if (!DECS.length) lines.push("- none");
  lines.push("", "## Open feedback");
  const of = openFeedback();
  of.forEach((f) => lines.push("- [" + f.section + (f.target ? "/" + f.target : "") + '] "' + String(f.text || "").replace(/\s+/g, " ") + '" (' + nameOf(f.by) + ", " + (f.at || "") + ")"));
  if (!of.length) lines.push("- none");
  lines.push("", "## Gates");
  ["plan", "report", ...Object.keys(L.gates).filter((k) => k !== "plan" && k !== "report")].forEach((k) => { const g = L.gates[k]; lines.push("- " + k + ": " + (g ? (g.approved ? "approved by " + nameOf(g.by) + ", " + (g.at || "") : "not approved") : "no answer")); });
  if (P.stop_rules?.length) { lines.push("", "## Stop rules"); P.stop_rules.forEach((x) => lines.push("- " + x)); }
  lines.push("", "## Run");
  lines.push(L.run ? "- wave " + L.run.wave + ", " + L.run.phase + (L.run.note ? ": " + L.run.note : "") + (L.run.sha ? " (head " + L.run.sha + ")" : "") : "- no run state");
  lines.push("", "## PRs");
  PRS.forEach((p) => { const lv = prLive(p.id); lines.push("- " + p.id + " (wave " + p.wave + "): " + prState(p) + (lv?.number ? " #" + lv.number : "") + (lv?.checks ? ", checks " + lv.checks : "") + "" + "; commits " + prTickets(p).join(" > ") + (stackOn(p) ? "; stacked on " + stackOn(p).id : "") + ((p.shares || []).length ? "; also edits " + p.shares.join(", ") : "")); });
  if (!PRS.length) lines.push("- none");
  lines.push("", "## Tickets");
  TICKETS.forEach((t) => { const st = L.status[t.id]; lines.push("- " + t.id + (OWNER[t.id] ? " (" + OWNER[t.id] + ")" : "") + ": " + tState(t.id) + (st?.note ? " (" + st.note + ")" : "") + ((st?.proof || []).length ? " proof: " + st.proof.join(", ") + (staleProof(st) ? " [old]" : "") : "")); });
  return lines.join("\n");
}

/* ================= mode and theme ================= */
function setMode(m) {
  UI.mode = m; store.set("book:mode", m);
  if (m === "agent" && UI.drawer) closeDrawer(true);
  document.body.classList.toggle("agent", m === "agent");
  document.getElementById("human").hidden = m !== "human";
  document.getElementById("agent").hidden = m !== "agent";
  renderHeader();
  if (m === "agent") { stopArch(); renderSide(); renderAgentView(); renderFoot(); }
  else renderHuman();
  window.scrollTo(0, 0);
}
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme() {
  const cur = store.get("book:theme") || "system";
  const nxt = cur === "system" ? "light" : cur === "light" ? "dark" : "system";
  store.set("book:theme", nxt); applyTheme(nxt); renderHeader();
  toast("Theme: " + nxt);
}

/* ================= live data ================= */
function loadDemo() {
  if (!DEMO) return;
  L.demo = true;
  L.status = DEMO.status || {};
  L.run = DEMO.run?.current || null;
  L.log = Object.entries(DEMO.log || {}).map(([id, r]) => ({ _id: id, ...r }));
  L.decisions = DEMO.decisions || {};
  L.feedback = Object.entries(DEMO.feedback || {}).map(([id, f]) => ({ _id: id, ...f }));
  L.gates = DEMO.gates || {};
  L.names = DEMO._names || {};
}
async function connect() {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch {}
  if (!db) { schedule(); return; }
  let user = null;
  try { user = await window.claude.use("user"); } catch {}
  L.db = db; L.user = user; L.live = true;
  if (L.demo) { L.demo = false; L.status = {}; L.run = null; L.log = []; L.decisions = {}; L.feedback = []; L.gates = {}; L.names = {}; }
  try { L.me = user ? await user.id() : null; } catch {}
  try { if (user && (await user.can("data.write")) === false) L.readOnly = true; } catch {}
  const onErr = (e) => { if (e?.code === "revoked") { L.live = false; L.db = null; } schedule(); };
  const docs = (sn) => sn.docs.filter((d) => d.exists);
  db.collection("status").onSnapshot((sn) => { L.status = Object.fromEntries(docs(sn).map((d) => [d.id, d.data()])); schedule(); }, onErr);
  db.collection("run").onSnapshot((sn) => { const c = docs(sn).find((d) => d.id === "current"); L.run = c ? c.data() : null; schedule(); }, onErr);
  db.collection("log").onSnapshot((sn) => { L.log = docs(sn).map((d) => ({ _id: d.id, ...d.data() })); schedule(); }, onErr);
  db.collection("decisions").onSnapshot((sn) => { L.decisions = Object.fromEntries(docs(sn).map((d) => [d.id, d.data()])); schedule(); resolveNames(); }, onErr);
  db.collection("feedback").onSnapshot((sn) => { L.feedback = docs(sn).map((d) => ({ _id: d.id, ...d.data() })); schedule(); resolveNames(); }, onErr);
  db.collection("gates").onSnapshot((sn) => { L.gates = Object.fromEntries(docs(sn).map((d) => [d.id, d.data()])); schedule(); resolveNames(); }, onErr);
  schedule();
}

/* ================= boot ================= */
applyTheme(store.get("book:theme") || "system");
loadDemo();
UI.mode = store.get("book:mode") === "agent" ? "agent" : "human";
document.body.classList.toggle("agent", UI.mode === "agent");
document.getElementById("human").hidden = UI.mode !== "human";
document.getElementById("agent").hidden = UI.mode !== "agent";
renderHeader();
if (UI.mode === "human") renderHuman(); else { renderSide(); renderAgentView(); renderFoot(); }
document.getElementById("scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && UI.drawer && !document.querySelector(".lb")) { e.preventDefault(); closeDrawer(); } });
const hash = location.hash.slice(1);
if (hash && /^[a-z0-9._~-]+$/i.test(hash)) requestAnimationFrame(() => { if (PR[hash]) openPR(hash); else if (T[hash]) openTicket(hash); else if (document.getElementById(hash)) jump(hash); });
window.addEventListener("resize", () => { const hh = document.getElementById("top").offsetHeight; document.documentElement.style.setProperty("--hh", hh + "px"); relayout(); });
if ("ResizeObserver" in window) new ResizeObserver(relayout).observe(document.getElementById("human"));
document.fonts?.ready?.then(relayout);
setInterval(() => { if (UI.mode === "human" && !document.activeElement?.dataset?.key) renderFoot(); }, 60000);
connect();
})();
</script>
