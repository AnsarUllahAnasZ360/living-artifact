<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header (title, round, stage stepper, mode and theme), a sticky left sidebar of sections
   with state dots, one reading column of sections, footer. Needs you opens the page. Agent mode swaps the
   sidebar for a file tree and the column for a raw viewer, in monochrome mono. */
:root {
  --bg: oklch(0.977 0.005 240);
  --panel: oklch(0.996 0.002 240);
  --sunk: oklch(0.945 0.008 245);
  --line: oklch(0.3 0.03 255 / 0.11);
  --line-2: oklch(0.3 0.03 255 / 0.22);
  --fg: oklch(0.23 0.025 258);
  --fg-2: oklch(0.45 0.022 258);
  --fg-3: oklch(0.6 0.016 258);
  --accent: oklch(0.49 0.14 262);
  --accent-soft: oklch(0.49 0.14 262 / 0.09);
  --on-accent: oklch(0.99 0 0);
  --need: oklch(0.74 0.15 68);
  --need-ink: oklch(0.52 0.12 62);
  --need-soft: oklch(0.8 0.13 75 / 0.16);
  --ok: oklch(0.57 0.12 155);
  --ok-soft: oklch(0.6 0.12 155 / 0.12);
  --bad: oklch(0.56 0.18 26);
  --bad-soft: oklch(0.6 0.18 26 / 0.1);
  --rev: oklch(0.54 0.13 305);
  --rev-soft: oklch(0.54 0.13 305 / 0.1);
  --shadow: 0 1px 2px oklch(0.3 0.03 255 / 0.06), 0 6px 24px -12px oklch(0.3 0.03 255 / 0.18);
  /* agent mode: black and white */
  --a-bg: oklch(1 0 0); --a-fg: oklch(0.12 0 0); --a-2: oklch(0.42 0 0); --a-line: oklch(0 0 0 / 0.16); --a-sunk: oklch(0.96 0 0);
  --display: "Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hh: 104px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.185 0.014 258); --panel: oklch(0.222 0.016 258); --sunk: oklch(0.16 0.012 258);
  --line: oklch(0.95 0.01 250 / 0.09); --line-2: oklch(0.95 0.01 250 / 0.18);
  --fg: oklch(0.95 0.008 250); --fg-2: oklch(0.76 0.014 252); --fg-3: oklch(0.6 0.014 252);
  --accent: oklch(0.76 0.11 262); --accent-soft: oklch(0.76 0.11 262 / 0.13); --on-accent: oklch(0.18 0.02 260);
  --need: oklch(0.8 0.14 76); --need-ink: oklch(0.83 0.12 78); --need-soft: oklch(0.8 0.14 76 / 0.13);
  --ok: oklch(0.75 0.13 155); --ok-soft: oklch(0.75 0.13 155 / 0.13);
  --bad: oklch(0.72 0.16 26); --bad-soft: oklch(0.72 0.16 26 / 0.13);
  --rev: oklch(0.75 0.12 305); --rev-soft: oklch(0.75 0.12 305 / 0.13);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 28px -12px oklch(0 0 0 / 0.6);
  --a-bg: oklch(0.13 0 0); --a-fg: oklch(0.93 0 0); --a-2: oklch(0.68 0 0); --a-line: oklch(1 0 0 / 0.16); --a-sunk: oklch(0.18 0 0);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: oklch(0.185 0.014 258); --panel: oklch(0.222 0.016 258); --sunk: oklch(0.16 0.012 258);
  --line: oklch(0.95 0.01 250 / 0.09); --line-2: oklch(0.95 0.01 250 / 0.18);
  --fg: oklch(0.95 0.008 250); --fg-2: oklch(0.76 0.014 252); --fg-3: oklch(0.6 0.014 252);
  --accent: oklch(0.76 0.11 262); --accent-soft: oklch(0.76 0.11 262 / 0.13); --on-accent: oklch(0.18 0.02 260);
  --need: oklch(0.8 0.14 76); --need-ink: oklch(0.83 0.12 78); --need-soft: oklch(0.8 0.14 76 / 0.13);
  --ok: oklch(0.75 0.13 155); --ok-soft: oklch(0.75 0.13 155 / 0.13);
  --bad: oklch(0.72 0.16 26); --bad-soft: oklch(0.72 0.16 26 / 0.13);
  --rev: oklch(0.75 0.12 305); --rev-soft: oklch(0.75 0.12 305 / 0.13);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 28px -12px oklch(0 0 0 / 0.6);
  --a-bg: oklch(0.13 0 0); --a-fg: oklch(0.93 0 0); --a-2: oklch(0.68 0 0); --a-line: oklch(1 0 0 / 0.16); --a-sunk: oklch(0.18 0 0);
  color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--hh) + 12px); }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); font-weight: 650; letter-spacing: -0.012em; text-wrap: balance; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; }
.ico.fill { fill: currentColor; stroke: none; }

/* ---------- header ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklch, var(--bg) 97%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
#top .in { max-width: 1320px; margin: 0 auto; padding-block: 12px 10px; display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.titleblk { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 12px; }
.titleblk h1 { font-size: 21px; line-height: 1.2; white-space: nowrap; }
.titleblk .tag { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row2 { display: flex; align-items: center; gap: 14px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; padding-bottom: 2px; }
.row2::-webkit-scrollbar { display: none; }
.roundchip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); }
.roundchip b { color: var(--fg); font-weight: 600; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 0; font-size: 12.5px; }
.step { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); }
.step i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
.step.done { color: var(--fg-2); } .step.done i { background: currentColor; }
.step.now { color: var(--accent); font-weight: 600; } .step.now i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step + .step::before { content: ""; width: 18px; height: 1.5px; background: var(--line-2); margin: 0 6px; }
.hlinks { display: inline-flex; gap: 6px; }
.hlink { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--fg-2); text-decoration: none; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
a.hlink:hover { color: var(--fg); border-color: var(--line-2); }
.hlink .mono { color: var(--fg); }
.owner { font-size: 12.5px; color: var(--fg-3); }
.sep { width: 1px; height: 16px; background: var(--line-2); flex: none; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); }
.live.on { color: var(--fg-2); } .live.on i { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--ok-soft); } }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 6px; font-size: 12.5px; color: var(--fg-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px oklch(0 0 0 / 0.12); font-weight: 550; }
.iconbtn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--fg-2); font-size: 15px; }
.iconbtn:hover { color: var(--fg); border-color: var(--line-2); }
#menuBtn { display: none; }

/* ---------- shell ---------- */
.shell { max-width: 1320px; margin: 0 auto; min-height: calc(100vh - var(--hh) - 56px); display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
#side { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--hh)); overflow-y: auto; padding-block: 28px 24px; scrollbar-width: thin; }
.nav { display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; color: var(--fg-2); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--sunk); color: var(--fg); }
.nav a.cur { color: var(--fg); background: var(--sunk); font-weight: 550; }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--fg-3); }
.dot.is-ready { background: var(--fg-3); border-color: var(--fg-3); }
.dot.is-live { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dot.is-need { background: var(--need); border-color: var(--need); }
.dot.is-later { background: transparent; border-style: dashed; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--need); color: oklch(0.22 0.04 70); font-size: 12px; font-weight: 650; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.navfoot { margin-top: 18px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-3); display: grid; gap: 4px; }
main { min-width: 0; padding-block: 8px 64px; max-width: 900px; }

/* ---------- sections ---------- */
.sec { padding-block: 44px 8px; scroll-margin-top: calc(var(--hh) + 8px); }
.sec + .sec { border-top: 1px solid var(--line); margin-top: 36px; }
.sh { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.sh h2 { font-size: 27px; line-height: 1.15; }
.sh .aside { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.later-tag { font-size: 12.5px; color: var(--fg-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 8px; }
.sec.later .body { opacity: 0.5; filter: grayscale(0.9); }
.lede { font-size: 17px; line-height: 1.5; max-width: 64ch; }
.sub { font-family: var(--display); font-size: 17px; font-weight: 600; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }
.sub .faint { font-family: var(--body); font-size: 13px; font-weight: 400; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); color: var(--fg-2); font-size: 12.5px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
a.chip:hover, button.chip:hover { color: var(--fg); border-color: var(--line-2); }
button.chip { cursor: pointer; }
.chip.need { background: var(--need-soft); border-color: transparent; color: var(--need-ink); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.rev { background: var(--rev-soft); border-color: transparent; color: var(--rev); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex: none; }
.st.todo i { background: transparent; border: 1.5px solid var(--fg-3); }
.st.doing i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.st.review i { background: var(--rev); }
.st.unverified i { background: transparent; border: 2px solid var(--need); }
.st.done i { background: var(--ok); }
.st.blocked i { background: var(--bad); }
.st.blocked { color: var(--bad); }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); font-size: 13.5px; font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn.ghost:hover { color: var(--fg); background: var(--sunk); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
.clamp.open { -webkit-line-clamp: unset; display: block; }
.more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 0; cursor: pointer; margin-top: 2px; justify-self: start; text-align: left; }

.note { font-size: 13px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--sunk); }
.empty { color: var(--fg-3); font-size: 14px; padding: 14px 0; }

/* ---------- needs you ---------- */
#needs { padding-top: 36px; }
.needs-head { font-family: var(--display); font-size: clamp(26px, 3.6vw, 36px); line-height: 1.12; font-weight: 650; letter-spacing: -0.02em; max-width: 24ch; text-wrap: balance; }
.needs-head .n { color: var(--need-ink); }
.runline { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14.5px; color: var(--fg-2); flex-wrap: wrap; }
.runline .phase { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 550; }
.runline .phase i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse2 2s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
.tally { display: flex; gap: 18px; margin-top: 18px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); align-items: center; }
.tally .bar { display: flex; height: 6px; width: 180px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.tally .bar span { display: block; height: 100%; }
.tally .k { display: inline-flex; align-items: center; gap: 6px; }
.tally .k i { width: 8px; height: 8px; border-radius: 2px; }
.asks { margin-top: 22px; display: grid; gap: 8px; }
.ask { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ask .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
.ask.dec .ic { background: var(--need-soft); color: var(--need-ink); }
.ask.blk .ic { background: var(--bad-soft); color: var(--bad); }
.ask.fb .ic { background: var(--accent-soft); color: var(--accent); }
.ask.gate .ic { background: var(--ok-soft); color: var(--ok); }
.ask .t { font-weight: 550; line-height: 1.35; }
.ask .m { font-size: 13px; color: var(--fg-2); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nextline { display: inline-flex; gap: 6px; align-items: baseline; margin-bottom: 14px; padding: 5px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 14px; max-width: 100%; }
.nextline b { color: var(--accent); font-weight: 650; }
.ask.info .ic { background: var(--sunk); color: var(--fg-2); }
.ask.gate { border-color: var(--ok); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.rules > div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; align-content: start; background: var(--panel); }
.rules h4 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.rules ol { padding-left: 18px; font-size: 13.5px; display: grid; gap: 3px; }
.rules ul li { list-style: none; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
.rules > div { min-width: 0; }
.rules .chips { display: block; }
.rules .chips .chip { white-space: normal !important; display: inline-block; max-width: 100%; height: auto; line-height: 1.4; padding-block: 3px; overflow-wrap: anywhere; }
.rules ul li .ico { color: var(--bad); transform: translateY(2px); }
.allclear { margin-top: 18px; display: flex; gap: 10px; align-items: center; color: var(--fg-2); }

/* ---------- problem and outcomes ---------- */
.today { display: grid; gap: 6px; margin-top: 18px; }
.today li { list-style: none; display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; color: var(--fg-2); }
.today li .ico { color: var(--bad); transform: translateY(2px); }
.quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 22px; }
.quote { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; }
.quote p { font-family: var(--display); font-size: 17px; line-height: 1.4; font-weight: 500; }
.quote span { display: block; font-size: 12.5px; color: var(--fg-3); margin-top: 6px; }
.outcomes { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
@media (max-width: 1000px) { .outcomes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .outcomes { grid-template-columns: minmax(0, 1fr); } }
.oc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; box-shadow: var(--shadow); }
.oc .ichead { display: flex; align-items: center; gap: 10px; }
.oc .ib { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 18px; }
.oc .claim { font-size: 15px; line-height: 1.45; font-weight: 500; }
.oc .ft { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dw { display: grid; gap: 5px; font-size: 13.5px; color: var(--fg-2); }
.dw li { list-style: none; display: flex; gap: 8px; align-items: baseline; }
.dw li .ico { color: var(--fg-3); transform: translateY(2px); }
.dw li.v-verified .ico { color: var(--ok); }
.dw li.v-bad .ico { color: var(--bad); }
.dw li.v-inc .ico { color: var(--need); }

/* ---------- findings ---------- */
.finds { display: grid; gap: 0; }
.fd { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); align-items: start; }
.fd:first-child { border-top: 0; }
.fd .side { display: grid; gap: 8px; min-width: 0; }
.fd .lab { font-size: 12.5px; color: var(--fg-3); display: flex; align-items: center; gap: 6px; }
.fd .txt { font-size: 15px; line-height: 1.45; }
.fd .arrow { color: var(--fg-3); padding-top: 22px; display: grid; justify-items: center; font-size: 18px; }
.imp { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 5px; }
.imp.high { background: var(--bad-soft); color: var(--bad); }
.imp.medium { background: var(--need-soft); color: var(--need-ink); }
.imp.low { background: var(--sunk); color: var(--fg-2); }

/* ---------- research ---------- */
.rq { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 8px; }
.rq > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 14px; }
.rq > summary::-webkit-details-marker { display: none; }
.rq > summary .chev { color: var(--fg-3); transition: transform 0.2s; }
.rq[open] > summary .chev { transform: rotate(90deg); }
.rq .q { font-weight: 550; line-height: 1.4; }
.rq .ans { padding: 0 14px 16px 46px; display: grid; gap: 12px; }
.recs li { list-style: none; display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.recs li .ico { color: var(--ok); transform: translateY(2px); }

/* ---------- architecture ---------- */
.arch { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.archbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.frames { display: flex; gap: 4px; flex-wrap: wrap; }
.frames button { border: 1px solid transparent; background: none; border-radius: 7px; padding: 4px 10px; font-size: 13px; color: var(--fg-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.frames button b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg-3); }
.frames button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.frames button[aria-current="true"] b { color: var(--accent); }
.archbar .ctl { margin-left: auto; display: flex; gap: 4px; }
.archfig { margin: 0; }
.archsvg { display: block; width: 100%; height: auto; color: var(--fg); }
.archcap { padding: 10px 14px 14px; font-size: 14px; color: var(--fg-2); display: flex; gap: 8px; align-items: baseline; }
.archcap b { color: var(--fg); font-weight: 600; }
.archpts { list-style: none; margin: 0; padding: 0 14px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; font-size: 13.5px; color: var(--fg-2); }
.archpts li { display: grid; gap: 2px; align-content: start; }
.archpts b { color: var(--fg); font-weight: 600; font-size: 13px; }
.an rect, .an path.shape { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.2; }
.an text { fill: var(--fg); font: 500 12.5px var(--body); }
.an text.k { fill: var(--fg-3); font: 400 10.5px var(--body); }
.an.ext rect { stroke-dasharray: 4 3; fill: var(--sunk); }
.an.isnew rect, .an.isnew path.shape { stroke: var(--accent); stroke-width: 1.8; fill: color-mix(in oklch, var(--panel) 88%, var(--accent)); }
.an.isnew text.k { fill: var(--accent); }
.ae path { fill: none; stroke: var(--fg-3); stroke-width: 1.3; }
.ae text { fill: var(--fg-2); font: 400 11px var(--body); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.ae.isnew path { stroke: var(--accent); }
.ae.isnew text { fill: var(--accent); }
.anim .an.isnew { animation: pop 0.55s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
.anim .ae.isnew path { stroke-dasharray: 400; animation: draw 0.8s 0.2s ease-out both; }
.anim .ae.isnew text { animation: fade 0.4s 0.6s both; }
@keyframes pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 550; color: var(--fg-3); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td:first-child { font-weight: 550; white-space: nowrap; }
.tbl td.b { color: var(--fg-2); }
.tbl td.a { color: var(--fg); }
.tbl td.a::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 2px; }

/* ---------- prototypes ---------- */
.protos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pc { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 16px; display: grid; gap: 10px; align-content: start; }
.pc.wide { grid-column: 1 / -1; }
.pc .top { display: flex; gap: 10px; align-items: center; }
.pc h3 { font-size: 16px; font-weight: 600; }
.pc .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pc iframe { width: 100%; height: 440px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

/* ---------- plan ---------- */
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 18px; }
.pr b { display: block; font-weight: 600; font-size: 14px; }
.pr span { font-size: 13.5px; color: var(--fg-2); }
.gatebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.track { display: flex; gap: 4px; margin: 4px 0 14px; }
.track .seg2 { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; position: relative; min-width: 24px; }
.track .seg2 span { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 4px; transition: width 0.6s ease; }
.ms { border-top: 1px solid var(--line); }
.ms:last-child { border-bottom: 1px solid var(--line); }
.ms > button { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 18px; gap: 14px; align-items: center; padding: 14px 4px; }
.ms > button:hover { background: color-mix(in oklch, var(--sunk) 60%, transparent); }
.ring { width: 36px; height: 36px; }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .bg { stroke: var(--sunk); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dasharray 0.6s ease; }
.ring text { font: 600 10.5px var(--body); fill: var(--fg-2); }
.ms .mt { font-weight: 600; font-size: 15.5px; }
.ms .mg { font-size: 13.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms .chev, .tk .chev { color: var(--fg-3); transition: transform 0.2s; }
.ms.open > button .chev, .tk.open .chev { transform: rotate(90deg); }
.ms .mbody { padding: 0 4px 18px 58px; display: grid; gap: 14px; }

.waves { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.wavebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.wavebar .cap { font-size: 13.5px; color: var(--fg-2); min-width: 0; flex: 1; }
.wavebar .cap b { color: var(--fg); font-weight: 600; }
.wavescroll { overflow-x: auto; }
.wavesvg { display: block; height: auto; }
.wcol .colbg { fill: transparent; transition: fill 0.3s; }
.wcol .lanebg { fill: var(--sunk); stroke: var(--line); stroke-dasharray: 3 3; }
.dep.inlane { opacity: 0.9; }
.wcol.on .colbg { fill: var(--accent-soft); }
.wcol .wh { fill: var(--fg); font: 600 13px var(--display); }
.wcol .ws { fill: var(--fg-3); font: 400 11.5px var(--body); }
.wcol.now .wh { fill: var(--accent); }
.tb rect.box { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.2; }
.tb text { fill: var(--fg); font: 500 12px var(--body); pointer-events: none; }
.tb text.ag { fill: var(--fg-3); font: 400 10.5px var(--mono); }
.tb rect.lane { fill: var(--fg-3); }
.tb.s-done rect.box { fill: color-mix(in oklch, var(--panel) 86%, var(--ok)); stroke: var(--ok); }
.tb.s-done rect.lane { fill: var(--ok); }
.tb.s-doing rect.box { stroke: var(--accent); }
.tb.s-doing rect.lane { fill: var(--accent); }
.tb.s-review rect.box { stroke: var(--rev); }
.tb.s-review rect.lane { fill: var(--rev); }
.tb.s-unverified rect.box { stroke: var(--need); stroke-dasharray: 4 3; }
.tb.s-unverified rect.lane { fill: var(--need); }
.tb.s-blocked rect.box { fill: color-mix(in oklch, var(--panel) 88%, var(--bad)); stroke: var(--bad); }
.tb.s-blocked rect.lane { fill: var(--bad); }
.tb { cursor: pointer; }
.tb:hover rect.box { stroke-width: 2; }
.tb .sweep { fill: var(--accent); opacity: 0.16; transform: scaleX(0); transform-box: fill-box; transform-origin: left; }
.wcol.on .tb .sweep { animation: sweep 1.3s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes sweep { to { transform: scaleX(1); } }
.dep { fill: none; stroke: var(--fg-3); stroke-width: 1.2; opacity: 0.45; transition: opacity 0.2s, stroke 0.2s; }
.dep.hi { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
.wavesvg.hov .dep:not(.hi) { opacity: 0.15; }
.gate line { stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 3 4; }
.gate path { fill: var(--panel); stroke: var(--fg-3); stroke-width: 1.4; }
.gate text { fill: var(--fg-3); font: 500 10.5px var(--body); }
.gate.on line { stroke: var(--need); stroke-dasharray: none; }
.gate.on path { fill: var(--need); stroke: var(--need); animation: gp 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.gate.on text { fill: var(--need-ink); }
.gate.passed path { fill: var(--ok); stroke: var(--ok); }
@keyframes gp { 50% { transform: scale(1.25); } }
.nowtag rect { fill: var(--accent); }
.nowtag text { fill: var(--on-accent); font: 600 10.5px var(--body); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.fbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; font-size: 12.5px; color: var(--fg-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); font-weight: 550; }
.fbtn .c { color: var(--fg-3); font-variant-numeric: tabular-nums; }
.tks { border-top: 1px solid var(--line-2); }
.tk { border-bottom: 1px solid var(--line); }
.tk > button { width: 100%; background: none; border: 0; cursor: pointer; text-align: left; display: grid; grid-template-columns: 96px minmax(0, 1fr) 150px 44px 40px 18px; gap: 12px; align-items: center; padding: 11px 4px; }
.tk > button:hover { background: color-mix(in oklch, var(--sunk) 60%, transparent); }
.tk .tt { font-weight: 500; min-width: 0; display: flex; gap: 8px; align-items: center; }
.tk .tt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk .mi { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk .wv, .tk .sz { font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.tk.flash > button { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); } }
.tbody { padding: 4px 4px 22px 112px; display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.kv > dt { color: var(--fg-3); font-size: 13px; padding-top: 1px; }
.kv > dd { margin: 0; min-width: 0; }
.files { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
.livebox { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--sunk); font-size: 13.5px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 120px; height: 76px; border-radius: 6px; border: 1px solid var(--line-2); overflow: hidden; display: block; padding: 0; background: var(--sunk); cursor: zoom-in; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .old { position: absolute; left: 4px; bottom: 4px; background: var(--need); color: oklch(0.22 0.04 70); font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; }

/* decisions */
.dec { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); padding: 14px; display: grid; gap: 12px; }
.dec.unopened { border-color: var(--need); box-shadow: 0 0 0 3px var(--need-soft); }
.dec .dq { display: flex; gap: 10px; align-items: flex-start; }
.dec .dn { flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--sunk); display: grid; place-items: center; font-size: 12px; font-weight: 650; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.dec.unopened .dn { background: var(--need); color: oklch(0.22 0.04 70); }
.dec .qq { font-weight: 600; line-height: 1.35; flex: 1; min-width: 0; }
.dec .why { font-size: 13.5px; color: var(--fg-2); --lines: 2; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line-2); border-radius: 9px; background: var(--bg); padding: 10px 12px; cursor: pointer; display: grid; gap: 3px; position: relative; transition: border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: var(--fg-3); }
.opt:disabled { cursor: default; }
.opt b { font-weight: 600; font-size: 14px; padding-right: 74px; }
.opt span { font-size: 12.5px; color: var(--fg-2); line-height: 1.4; }
.opt .rec { position: absolute; top: 9px; right: 9px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }
.opt.chosen { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.pending { border-color: var(--need); box-shadow: inset 0 0 0 1px var(--need); }
.dact { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dact input { flex: 1; min-width: 160px; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 0 10px; font: inherit; font-size: 13.5px; }
.who { font-size: 12.5px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.who q { color: var(--fg-2); }
.decs { display: grid; gap: 10px; }

/* feedback */
.fbw { display: grid; gap: 8px; }
.fbt { display: grid; gap: 6px; }
.fbi { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); display: grid; gap: 3px; }
.fbi .h { font-size: 12px; color: var(--fg-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fbi .ans { color: var(--fg-2); font-size: 13px; }
.fbi.res { opacity: 0.75; }
.fbform { display: grid; gap: 6px; }
.fbform textarea { width: 100%; min-height: 64px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 8px 10px; font: inherit; font-size: 14px; resize: vertical; }
.fbform .r { display: flex; gap: 8px; align-items: center; }

/* kickoff */
.kick { position: relative; border: 1px solid var(--line-2); border-radius: 12px; background: var(--sunk); }
.kick pre { margin: 0; padding: 18px 18px 18px; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
.kick .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.kick .bar .btn { margin-left: auto; }

/* progress */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--display); font-size: 30px; font-weight: 650; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .v small { font-size: 16px; color: var(--fg-3); font-weight: 500; }
.kpi .l { font-size: 13px; color: var(--fg-2); }
.wprog { display: grid; gap: 10px; margin-top: 4px; }
.wp { display: grid; grid-template-columns: 170px minmax(0, 1fr) 54px; gap: 14px; align-items: center; font-size: 13.5px; }
.wp .n { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wp .n b { color: var(--fg); font-weight: 600; }
.wp .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunk); gap: 2px; }
.wp .bar span { height: 100%; transition: flex-grow 0.6s ease; }
.wp .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.col { background: var(--sunk); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; align-content: start; min-height: 64px; }
.col .ch { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 0 2px 4px; }
.col .ch .c { color: var(--fg-3); font-variant-numeric: tabular-nums; }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; display: grid; gap: 2px; }
.card:hover { border-color: var(--line-2); }
.card .w { font-size: 11.5px; color: var(--fg-3); }
.tl { display: grid; gap: 0; }
.tlr { font-family: var(--display); font-weight: 600; font-size: 15px; margin: 18px 0 8px; display: flex; gap: 10px; align-items: center; }
.tlr:first-child { margin-top: 0; }
.le { display: grid; grid-template-columns: 100px 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 5px 0; font-size: 13.5px; position: relative; }
.le .t { color: var(--fg-3); font-size: 12px; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.le .k { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; background: var(--sunk); color: var(--fg-2); }
.le .k.gate, .le .k.done, .le .k.proof, .le .k.merge { color: var(--ok); background: var(--ok-soft); }
.le .k.blocked { color: var(--bad); background: var(--bad-soft); }
.le .k.decision { color: var(--need-ink); background: var(--need-soft); }
.le .k.review, .le .k.fix { color: var(--rev); background: var(--rev-soft); }
.le .k.start { color: var(--accent); background: var(--accent-soft); }

/* report */
.pending-report { border: 1px dashed var(--line-2); border-radius: 12px; padding: 22px; display: grid; gap: 14px; }
.pending-report .ghost { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pending-report .ghost div { height: 64px; border-radius: 8px; background: var(--sunk); display: grid; align-content: center; padding: 0 12px; font-size: 13px; color: var(--fg-3); }
.r3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rb { border-radius: var(--r); padding: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.rb h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.rb.you { border-color: var(--need); box-shadow: 0 0 0 3px var(--need-soft); }
.rb ul li { list-style: none; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
.rb ul li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); flex: none; transform: translateY(-2px); }
.attn { border-left: 3px solid var(--need); padding: 8px 14px; background: var(--need-soft); border-radius: 0 8px 8px 0; display: grid; gap: 4px; font-size: 13.5px; }
.proofs { display: grid; }
.pf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.pf .d { font-weight: 500; }
.pf .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); grid-column: 1 / -1; }
.verdict { font-size: 12.5px; font-weight: 650; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.verdict.verified { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.inc { background: var(--need-soft); color: var(--need-ink); }

/* history */
.hist { position: relative; padding-left: 26px; }
.hist::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.hr { position: relative; padding-bottom: 14px; }
.hr::before { content: ""; position: absolute; left: -24px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg-3); }
.hr.now::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.hr > details > summary, .hr > .nowrow { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hr > details > summary::-webkit-details-marker { display: none; }
.hr .rn { font-family: var(--display); font-weight: 650; font-size: 15px; }
.hr .ti { font-weight: 500; }
.hr .dt { font-size: 12.5px; color: var(--fg-3); }
.hr .hb { padding: 10px 0 4px; display: grid; gap: 10px; font-size: 14px; max-width: 66ch; }
.hr .hb dl { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.hr .hb dt { color: var(--fg-3); font-size: 13px; }

/* lightbox, toast */
